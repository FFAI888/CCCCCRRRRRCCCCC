<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRC 稳定控制面板 v5.2 - PandaTokenV4</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #0a0e17;
            --card: #111827;
            --border: #1f2a3a;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --accent: #3b82f6;
            --accent2: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1700px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .version {
            background: var(--accent);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 24px;
            margin-bottom: 18px;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: #334155;
        }
        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }
        .card h3 {
            font-size: 1rem;
            margin: 12px 0 10px;
            color: var(--text2);
            font-weight: 500;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: center;
        }
        input,
        select,
        button {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        input {
            min-width: 140px;
        }
        button {
            cursor: pointer;
            background: var(--accent);
            border: none;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        button:hover {
            filter: brightness(1.18);
            transform: translateY(-1px);
        }
        button:active {
            transform: scale(0.97);
        }
        button.danger {
            background: var(--danger);
        }
        button.success {
            background: var(--accent2);
        }
        button.wallet-btn {
            background: var(--accent2);
            font-size: 0.9rem;
        }
        button.refresh-btn {
            background: #475569;
        }
        button.purple-btn {
            background: var(--purple);
        }
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
        }
        .data-item {
            background: #0f172a;
            padding: 11px 15px;
            border-radius: 11px;
            border: 1px solid #1e293b;
            transition: border-color 0.2s;
        }
        .data-item:hover {
            border-color: #334155;
        }
        .data-item label {
            font-size: 0.73rem;
            color: var(--text2);
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .data-item span {
            font-size: 1.05rem;
            font-weight: 600;
            word-break: break-all;
            color: #f1f5f9;
        }
        .tooltip {
            position: relative;
            cursor: help;
            border-bottom: 1px dashed var(--text2);
            font-size: 0.8rem;
            display: inline-block;
        }
        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            left: 0;
            top: 115%;
            background: #1e293b;
            color: #fff;
            padding: 8px 13px;
            border-radius: 8px;
            font-size: 0.78rem;
            width: max-content;
            max-width: 320px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            border: 1px solid var(--border);
            pointer-events: none;
            white-space: normal;
            line-height: 1.4;
        }
        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }
        .tabs {
            display: flex;
            gap: 7px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .tab {
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 9px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            user-select: none;
        }
        .tab:hover {
            border-color: var(--accent);
            color: #fff;
        }
        .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .hidden {
            display: none !important;
        }
        .status-text {
            font-size: 0.82rem;
            margin-left: 10px;
            font-weight: 500;
        }
        hr {
            border-color: var(--border);
            margin: 16px 0;
            border-width: 0.5px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-on {
            background: #065f46;
            color: #6ee7b7;
        }
        .badge-off {
            background: #7f1d1d;
            color: #fca5a5;
        }
        .event-log {
            background: #0f172a;
            border-radius: 10px;
            padding: 12px 15px;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.6;
            word-break: break-word;
        }
        .event-log strong {
            color: var(--accent2);
        }
        .alert-box {
            background: #331c1c;
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .data-grid {
                grid-template-columns: 1fr;
            }
            input {
                min-width: 100%;
                flex: 1;
            }
            .input-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div style="display: flex; align-items: center; gap: 14px;">
                <h1>🛡️ CRC 稳定控制面板</h1>
                <span class="version">v5.2</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="connectWallet" class="wallet-btn">🔌 连接钱包</button>
                <span id="walletAddress" style="font-size:0.88rem; color: var(--text2);"></span>
            </div>
        </div>

        <!-- 合约加载 -->
        <div class="card">
            <div class="input-group">
                <input type="text" id="contractAddress" placeholder="输入 PandaTokenV4 合约地址" style="flex:1; min-width:280px;">
                <button id="loadContract" class="success">📦 加载合约</button>
                <button id="saveAddress" class="refresh-btn">💾 保存</button>
                <span style="font-size:0.78rem; color: var(--text2);">自动保存到本地</span>
            </div>
            <div id="contractStatus" style="margin-top: 8px; color: var(--warning); font-size:0.9rem;"></div>
        </div>

        <!-- 标签页 -->
        <div class="tabs" id="tabGroup">
            <div class="tab active" data-tab="token">📊 代币</div>
            <div class="tab" data-tab="tax">🧾 税率</div>
            <div class="tab" data-tab="stabilize">⚖️ 稳定</div>
            <div class="tab" data-tab="lp">💧 挖矿</div>
            <div class="tab" data-tab="invite">👥 邀请</div>
            <div class="tab" data-tab="advanced">⚙️ 高级</div>
            <div class="tab" data-tab="admin">🛡️ 管理</div>
        </div>

        <!-- 面板容器 -->
        <div id="panel-token" class="card">
            <h2>📊 代币数据 <span id="status-token" class="status-text"></span></h2>
            <div class="data-grid" id="tokenData"></div>
        </div>
        <div id="panel-tax" class="card hidden">
            <h2>🧾 税率配置 <span id="status-tax" class="status-text"></span></h2>
            <div class="data-grid" id="taxData"></div>
            <hr>
            <h3>✏️ 修改交易税率（completeCustoms）</h3>
            <div class="input-group" id="taxSetters"></div>
            <hr>
            <h3>✏️ 修改流动性税率</h3>
            <div class="input-group" id="liqTaxSetters"></div>
        </div>
        <div id="panel-stabilize" class="card hidden">
            <h2>⚖️ 稳定机制 <span id="status-stabilize" class="status-text"></span></h2>
            <div class="data-grid" id="stabilizeData"></div>
            <hr>
            <h3>🔍 稳定操作地址</h3>
            <div class="data-grid" id="stabilizeAddresses"></div>
            <hr>
            <h3>💰 当前余额验证 <button id="verifyBalances" class="refresh-btn" style="margin-left:10px;">🔄 查询当前余额</button></h3>
            <div id="balanceVerification" style="margin-top:8px;"></div>
            <hr>
            <h3>📋 最近执行记录 <button id="fetchStableEvents" class="refresh-btn" style="margin-left:10px;">🔄 查询最近事件</button></h3>
            <div id="stableEventsResult" style="margin-top:8px;"></div>
            <hr>
            <h3>✏️ 设置稳定参数</h3>
            <div class="input-group" id="stabilizeSetters"></div>
        </div>
        <div id="panel-lp" class="card hidden">
            <h2>💧 LP 挖矿 <span id="status-lp" class="status-text"></span></h2>
            <div class="data-grid" id="lpData"></div>
            <hr>
            <h3>✏️ 设置挖矿参数</h3>
            <div class="input-group" id="lpSetters"></div>
            <hr>
            <h3>✏️ 排除/恢复 LP 提供者</h3>
            <div class="input-group" id="lpExcludeSetters"></div>
        </div>
        <div id="panel-invite" class="card hidden">
            <h2>👥 邀请系统 <span id="status-invite" class="status-text"></span></h2>
            <div class="data-grid" id="inviteData"></div>
            <hr>
            <h3>✏️ 设置邀请参数</h3>
            <div class="input-group" id="inviteSetters"></div>
            <hr>
            <h3>🔍 查询邀请关系</h3>
            <div class="input-group" id="inviteQuery"></div>
            <div id="inviteQueryResult" style="margin-top:8px;font-size:0.9rem;color:var(--accent2);"></div>
        </div>
        <div id="panel-advanced" class="card hidden">
            <h2>⚙️ 高级控制 <span id="status-advanced" class="status-text"></span></h2>
            <div class="data-grid" id="advancedData"></div>
            <hr>
            <h3>✏️ 设置参数</h3>
            <div class="input-group" id="advancedSetters"></div>
            <hr>
            <h3>🔘 开关控制</h3>
            <div class="input-group" id="advancedToggles"></div>
        </div>
        <div id="panel-admin" class="card hidden">
            <h2>🛡️ 管理员操作 <span id="status-admin" class="status-text"></span></h2>
            <div class="data-grid" id="adminData"></div>
            <hr>
            <h3>🔧 核心操作</h3>
            <div class="input-group" id="adminActions"></div>
            <hr>
            <h3>📋 名单管理</h3>
            <div class="input-group" id="adminLists"></div>
            <hr>
            <h3>💼 其他设置</h3>
            <div class="input-group" id="adminExtra"></div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 初始化 ====================
            const BSC_RPC = "https://bsc-dataseed.binance.org/";
            let provider = new ethers.providers.JsonRpcProvider(BSC_RPC);
            let signer = null;
            let contract = null;
            let currentAddr = "";
            let currentPanel = "token";
            let tokenDecimals = 18;
            let currencyAddress = ""; // 存储结算币种地址
            let currencyIsEth = false;

            // 完整ABI —— 与PandaTokenV4合约一一对应
            const abi = [
                "function name() view returns (string)",
                "function symbol() view returns (string)",
                "function decimals() view returns (uint256)",
                "function totalSupply() view returns (uint256)",
                "function balanceOf(address) view returns (uint256)",
                "function allowance(address,address) view returns (uint256)",
                "function getCirculatingSupply() view returns (uint256)",
                "function owner() view returns (address)",
                "function _mainPair() view returns (address)",
                "function fundAddress() view returns (address)",
                "function deadAddress() view returns (address)",
                "function _allWhiteList(address) view returns (bool)",
                "function _rewardList(address) view returns (bool)",
                "function isReward(address) view returns (uint256)",
                "function enableRewardList() view returns (bool)",
                "function enableMint() view returns (bool)",
                "function enablePause() view returns (bool)",
                "function enableWalletLimit() view returns (bool)",
                "function pause() view returns (bool)",
                "function enableChangeTax() view returns (bool)",
                "function enableOffTrade() view returns (bool)",
                "function enableKillBlock() view returns (bool)",
                "function enableAutoTrigger() view returns (bool)",
                "function antiSYNC() view returns (bool)",
                "function airdropEnable() view returns (bool)",
                "function limitAddLiquidity() view returns (bool)",
                "function _buyFundFee() view returns (uint256)",
                "function _buyLPFee() view returns (uint256)",
                "function buy_burnFee() view returns (uint256)",
                "function _sellFundFee() view returns (uint256)",
                "function _sellLPFee() view returns (uint256)",
                "function sell_burnFee() view returns (uint256)",
                "function addLiquidityFee() view returns (uint256)",
                "function removeLiquidityFee() view returns (uint256)",
                "function numTokensSellRate() view returns (uint256)",
                "function kb() view returns (uint256)",
                "function startTradeBlock() view returns (uint256)",
                "function airdropNumbs() view returns (uint256)",
                "function _minTransAmount() view returns (uint256)",
                "function maxWalletAmount() view returns (uint256)",
                "function lpBurnRate() view returns (uint256)",
                "function lpBurnFrequency() view returns (uint256)",
                "function lastLpBurnTime() view returns (uint256)",
                "function mineRate() view returns (uint256)",
                "function LPRewardCondition() view returns (uint256)",
                "function minLPHoldAmount() view returns (uint256)",
                "function minInvitorHoldAmount() view returns (uint256)",
                "function _LPRewardDistributor() view returns (address)",
                "function generations() view returns (uint256)",
                "function fristRate() view returns (uint256)",
                "function secondRate() view returns (uint256)",
                "function thirdRate() view returns (uint256)",
                "function leftRate() view returns (uint256)",
                "function _inviter(address) view returns (address)",
                "function getBinderLength(address) view returns (uint256)",
                "function totalBuyAmount() view returns (uint256)",
                "function totalSellAmount() view returns (uint256)",
                "function buyTriggerThreshold() view returns (uint256)",
                "function sellTriggerThreshold() view returns (uint256)",
                "function triggerActionPercent() view returns (uint256)",
                "function maxDailyTriggers() view returns (uint8)",
                "function dailyTriggerCount() view returns (uint8)",
                "function triggerCooldown() view returns (uint256)",
                "function cooldownRemaining() view returns (uint256)",
                "function pendingSellExecute() view returns (bool)",
                "function pendingBuyExecute() view returns (bool)",
                "function currency() view returns (address)",
                "function currencyIsEth() view returns (bool)",
                "function completeCustoms(uint256[]) external",
                "function setAutoTriggerParams(uint256,uint256,uint256,uint8,uint256) external",
                "function setLPRewardCondition(uint256) external",
                "function setMinLPHoldAmount(uint256) external",
                "function setMinInvitorHoldAmount(uint256) external",
                "function changeInviteRate(uint256[]) external",
                "function launch() external",
                "function PauseTransaction() external",
                "function recoverTransaction() external",
                "function disableWalletLimit() external",
                "function changeWalletLimit(uint256) external",
                "function setEnableAutoTrigger(bool) external",
                "function setLimitAddLiquidity(bool) external",
                "function setlpBurnRate(uint256) external",
                "function setlpBurnFrequency(uint256) external",
                "function setAirDropEnable(bool) external",
                "function setAirdropNumbs(uint256) external",
                "function setkb(uint256) external",
                "function setAntiSYNCEnable(bool) external",
                "function setNumTokensSellRate(uint256) external",
                "function disableChangeTax() external",
                "function setWhiteList(address[],bool) external",
                "function multi_bclist(address[],bool) external",
                "function mintTokens(address,uint256) external",
                "function forceResetTriggers() external",
                "function setSwapPairList(address,bool) external",
                "function setMinTransAmount(uint256) external",
                "function setFundAddress(address) external",
                "function setAddLiquidityFee(uint256) external",
                "function setRemoveLiquidityFee(uint256) external",
                "function setExcludeLPProvider(address,bool) external",
                "function setClaims(address,uint256) external",
                "event StabilizeSellExecuted(uint256 indexed tokensSold, uint256 indexed usdtReceived)",
                "event StabilizeBuyExecuted(uint256 indexed usdtSpent, uint256 indexed tokensBought)"
            ];

            function toWei(val, dec) {
                dec = dec || tokenDecimals;
                try { return ethers.utils.parseUnits(String(val), dec); } catch (e) { return ethers.BigNumber.from(
                        0); }
            }

            function fromWei(val, dec) {
                dec = dec || tokenDecimals;
                try { return ethers.utils.formatUnits(val, dec); } catch (e) { return String(val); }
            }

            function basisToPercent(basis) {
                return (Number(basis) / 100).toFixed(2) + '%';
            }

            function bnToNum(bn) {
                try { return Number(ethers.utils.formatUnits(bn, 0)); } catch (e) { return Number(bn); }
            }

            function setStatus(panel, msg, isErr) {
                const el = document.getElementById('status-' + panel);
                if (!el) return;
                el.textContent = msg;
                el.style.color = isErr ? 'var(--danger)' : 'var(--accent2)';
                if (!msg.includes('❌')) {
                    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 5000);
                }
            }

            // 标签切换
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentPanel = tab.dataset.tab;
                    document.querySelectorAll('[id^="panel-"]').forEach(p => p.classList.add(
                    'hidden'));
                    const panelEl = document.getElementById('panel-' + currentPanel);
                    if (panelEl) panelEl.classList.remove('hidden');
                    loadPanel(currentPanel);
                });
            });

            // 连接钱包
            document.getElementById('connectWallet').onclick = async () => {
                if (!window.ethereum) {
                    alert('请安装MetaMask或其他Web3钱包');
                    return;
                }
                try {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    const addr = await signer.getAddress();
                    document.getElementById('walletAddress').textContent = '✅ ' + addr.slice(0, 6) + '...' + addr
                        .slice(-4);
                    if (currentAddr && ethers.utils.isAddress(currentAddr)) {
                        contract = new ethers.Contract(currentAddr, abi, signer || provider);
                        loadPanel(currentPanel);
                    }
                } catch (e) {
                    alert('连接钱包失败: ' + e.message);
                }
            };

            document.getElementById('loadContract').onclick = loadContract;
            document.getElementById('saveAddress').onclick = () => {
                const addr = document.getElementById('contractAddress').value.trim();
                if (addr) localStorage.setItem('crc_addr_v5', addr);
            };

            async function loadContract() {
                const addr = document.getElementById('contractAddress').value.trim();
                if (!ethers.utils.isAddress(addr)) {
                    document.getElementById('contractStatus').innerHTML =
                        '<span style="color:var(--danger);">❌ 无效的合约地址</span>';
                    return;
                }
                currentAddr = addr;
                localStorage.setItem('crc_addr_v5', addr);
                try {
                    if (!signer && window.ethereum) {
                        await window.ethereum.request({ method: 'eth_requestAccounts' });
                        provider = new ethers.providers.Web3Provider(window.ethereum);
                        signer = provider.getSigner();
                        const wa = await signer.getAddress();
                        document.getElementById('walletAddress').textContent = '✅ ' + wa.slice(0, 6) + '...' + wa.slice(
                            -4);
                    }
                } catch (e) {}
                contract = new ethers.Contract(addr, abi, signer || provider);
                try {
                    const dec = await contract.decimals();
                    tokenDecimals = bnToNum(dec);
                    if (tokenDecimals < 1 || tokenDecimals > 30) tokenDecimals = 18;
                    const curAddr = await contract.currency();
                    currencyAddress = curAddr;
                    const isEth = await contract.currencyIsEth();
                    currencyIsEth = isEth;
                } catch (e) {
                    tokenDecimals = 18;
                }
                document.getElementById('contractStatus').innerHTML =
                    '✅ 合约已加载 | 精度: ' + tokenDecimals + ' | ' + addr.slice(0, 10) + '...';
                loadPanel(currentPanel);
            }

            async function loadPanel(panel) {
                if (!contract) {
                    if (currentAddr && ethers.utils.isAddress(currentAddr)) {
                        contract = new ethers.Contract(currentAddr, abi, signer || provider);
                    } else {
                        document.getElementById('status-' + panel).textContent = '❌ 请先加载合约';
                        return;
                    }
                }
                setStatus(panel, '⏳ 加载中...');
                try {
                    switch (panel) {
                        case 'token':
                            await loadToken();
                            break;
                        case 'tax':
                            await loadTax();
                            break;
                        case 'stabilize':
                            await loadStabilize();
                            break;
                        case 'lp':
                            await loadLP();
                            break;

                    const filterSell = {
                        address: contract.address,
                        topics: [sellTopic],
                        fromBlock: fromBlock,
                        toBlock: currentBlock
                    };
                    const filterBuy = {
                        address: contract.address,
                        topics: [buyTopic],
                        fromBlock: fromBlock,
                        toBlock: currentBlock
                    };
                    const [sellLogs, buyLogs] = await Promise.all([
                        provider.getLogs(filterSell),

                    ]);

                        const tokensSold = parsed.args.tokensSold;

                        html +=
                            `<div class="event-log"><strong>📤 最近卖出执行</strong><br>交易哈希: <a href="https://bscscan.com/tx/${lastSell.transactionHash}" target="_blank" style="color:#3b82f6;">${lastSell.transactionHash.slice(0,20)}...</a><br>卖出代币数量: ${fromWei(tokensSold)}<br>获得USDT/ETH: ${fromWei(usdtReceived, 18)}<br>区块: ${lastSell.blockNumber}</div>`;

                    contract.lpBurnRate(), contract.lpBurnFrequency(), contract.lastLpBurnTime(),
                    contract.antiSYNC(), contract.enableOffTrade(), contract.enableKillBlock(), contract.kb(),
                    contract.startTradeBlock(), contract.airdropEnable(), contract.airdropNumbs(),
                    contract._minTransAmount(), contract.limitAddLiquidity(), contract.enableChangeTax(),
                    contract.numTokensSellRate(), contract.enableRewardList().catch(() => true)
                ]);
                const bRateNum = bnToNum(bRate);
                const bFreqNum = bnToNum(bFreq);
                const lastBDate = bnToNum(lastB) > 0 ? new Date(bnToNum(lastB) * 1000).toLocaleString() : '从未';
                document.getElementById('advancedData').innerHTML = `
                <div class="data-item"><label>底池燃烧比例</label><span>${bRateNum} (${basisToPercent(bRateNum)})</span></div>
                <div class="data-item"><label>燃烧间隔(秒)</label><span>${bFreqNum} (${(bFreqNum/3600).toFixed(1)}h)</span></div>
                <div class="data-item"><label>上次燃烧</label><span>${lastBDate}</span></div>
                <div class="data-item"><label>反MEV(antiSYNC)</label><span>${anti ? '<span class="badge badge-on">✅ 开启</span>' : '<span class="badge badge-off">❌ 关闭</span>'}</span></div>
                <div class="data-item"><label>开盘控制</label><span>${off ? '<span class="badge badge-on">✅ 需launch</span>' : '<span class="badge badge-off">❌ 无</span>'}</span></div>
                <div class="data-item"><label>杀区块</label><span>${kill ? '<span class="badge badge-on">✅ 开启</span>' : '<span class="badge badge-off">❌ 关闭</span>'} | 数量:${bnToNum(_kb)}</span></div>
                <div class="data-item"><label>开盘区块</label><span>${bnToNum(start)>0 ? bnToNum(start) : '未启动'}</span></div>
                <div class="data-item"><label>空投</label><span>${adEn ? '<span class="badge badge-on">✅ 开启</span>' : '<span class="badge badge-off">❌ 关闭</span>'} | 每次${bnToNum(adNum)}地址</span></div>
                <div class="data-item"><label>最小转账</label><span>${fromWei(minTx)} 代币</span></div>
                <div class="data-item"><label>禁止加流动性</label><span>${limitAdd ? '<span class="badge badge-off">🚫 是</span>' : '<span class="badge badge-on">✅ 允许</span>'}</span></div>
                <div class="data-item"><label>税率可改</label><span>${chTax ? '<span class="badge badge-on">✅</span>' : '<span class="badge badge-off">❌ 锁定</span>'}</span></div>
                <div class="data-item"><label>兑换阈值%</label><span>${bnToNum(numSell)}%</span></div>
                <div class="data-item"><label>黑名单功能</label><span>${enRewardList ? '<span class="badge badge-on">✅ 启用</span>' : '<span class="badge badge-off">❌ 禁用</span>'}</span></div>
              `;
                document.getElementById('advancedSetters').innerHTML = `
                <input id="advBurnRate" placeholder="燃烧比例(基点,≤100)" type="number"><input id="advBurnFreq" placeholder="燃烧间隔(小时)" type="number">
                <input id="advKb" placeholder="杀区块数" type="number"><input id="advAdNum" placeholder="空投地址数(≤5)" type="number" max="5">
                <input id="advNumSell" placeholder="兑换阈值%" type="number"><input id="advMinTx" placeholder="最小转账(代币数)" type="number" step="any">
                <button onclick="window.setAdvanced()" class="success">✏️ 更新参数</button>
              `;
                document.getElementById('advancedToggles').innerHTML = `
                <button onclick="window.toggleAirDrop(true)">✅ 开启空投</button><button onclick="window.toggleAirDrop(false)" class="danger">❌ 关闭空投</button>
                <button onclick="window.toggleAntiSync(true)">✅ 反MEV开</button><button onclick="window.toggleAntiSync(false)">❌ 反MEV关</button>
                <button onclick="window.toggleLimitAdd(true)" class="danger">🚫 禁止加流动</button><button onclick="window.toggleLimitAdd(false)" class="success">✅ 允许加流动</button>
                <button onclick="window.disableTaxChange()" class="danger">🔒 永久禁改税率</button>
              `;
            }

            window.setAdvanced = async function() {
                const c = contract.connect(signer);
                const br = document.getElementById('advBurnRate').value;
                const bf = document.getElementById('advBurnFreq').value;
                const kb = document.getElementById('advKb').value;
                const ad = document.getElementById('advAdNum').value;
                const ns = document.getElementById('advNumSell').value;
                const minTx = document.getElementById('advMinTx').value;
                let updated = false;
                if (br && !isNaN(br)) { const v = parseInt(br); if (v <= 100) { await c.setlpBurnRate(v);
                        updated = true; } else { alert('燃烧比例必须 ≤ 100'); } }
                if (bf && !isNaN(bf)) { await c.setlpBurnFrequency(parseInt(bf));
                    updated = true; }
                if (kb && !isNaN(kb)) { await c.setkb(parseInt(kb));
                    updated = true; }
                if (ad && !isNaN(ad)) { const v = parseInt(ad); if (v <= 5) { await c.setAirdropNumbs(v);
                        updated = true; } else { alert('空投地址数必须 ≤ 5'); } }
                if (ns && !isNaN(ns)) { await c.setNumTokensSellRate(parseInt(ns));
                    updated = true; }
                if (minTx && !isNaN(minTx)) { await c.setMinTransAmount(await toWei(minTx));
                    updated = true; }
                if (updated) { alert('高级参数已更新');
                    loadPanel('advanced'); } else { alert('请至少输入一个有效值'); }
            };

            window.toggleAirDrop = async function(v) { await contract.connect(signer).setAirDropEnable(v);
                loadPanel('advanced'); };
            window.toggleAntiSync = async function(v) { await contract.connect(signer).setAntiSYNCEnable(v);
                loadPanel('advanced'); };
            window.toggleLimitAdd = async function(v) { await contract.connect(signer).setLimitAddLiquidity(v);
                loadPanel('advanced'); };
            window.disableTaxChange = async function() {
                if (!confirm('确定永久锁定税率修改？此操作不可逆！')) return;
                await contract.connect(signer).disableChangeTax();
                alert('税率修改已永久锁定');
                loadPanel('advanced');
            };

            // -------------------- 管理员 --------------------
            async function loadAdmin() {
                const [paused, pEn, mEn, wEn, maxW, fund, autoTrig, own, enRewardList, enOffTrade] = await Promise
                .all([
                    contract.pause(), contract.enablePause(), contract.enableMint(), contract.enableWalletLimit(),
                    contract.maxWalletAmount(), contract.fundAddress(), contract.enableAutoTrigger(), contract
                    .owner(),
                    contract.enableRewardList().catch(() => true), contract.enableOffTrade()
                ]);
                document.getElementById('adminData').innerHTML = `
                <div class="data-item"><label>暂停状态</label><span>${paused ? '<span class="badge badge-off">⏸️ 暂停</span>' : '<span class="badge badge-on">▶️ 运行</span>'}</span></div>
                <div class="data-item"><label>可暂停</label><span>${pEn ? '✅' : '❌'}</span></div>
                <div class="data-item"><label>可增发</label><span>${mEn ? '✅' : '❌'}</span></div>
                <div class="data-item"><label>钱包限制</label><span>${wEn ? '✅ 启用' : '❌ 禁用'}</span></div>
                <div class="data-item"><label>最大持仓</label><span>${fromWei(maxW)} 代币</span></div>
                <div class="data-item"><label>基金地址</label><span style="font-size:0.78rem;">${fund}</span></div>
                <div class="data-item"><label>自动稳定</label><span>${autoTrig ? '<span class="badge badge-on">✅ 开启</span>' : '<span class="badge badge-off">❌ 关闭</span>'}</span></div>
                <div class="data-item"><label>当前Owner</label><span style="font-size:0.78rem;">${own}</span></div>
                <div class="data-item"><label>黑名单功能</label><span>${enRewardList ? '✅ 启用' : '❌ 禁用'}</span></div>
                <div class="data-item"><label>开盘控制</label><span>${enOffTrade ? '✅ 需launch' : '❌ 无'}</span></div>
              `;
                document.getElementById('adminActions').innerHTML = `
                <button onclick="window.launch()" class="success">🚀 启动交易</button>
                <button onclick="window.pauseTx()" class="danger">⏸️ 暂停</button>
                <button onclick="window.resumeTx()" class="success">▶️ 恢复</button>
                <button onclick="window.disableWL()">🚫 取消持仓限额</button>
                <button onclick="window.toggleAutoStabilizeAdmin()">⚙️ 切换自动稳定</button>
                <button onclick="window.forceResetStabilizeAdmin()">🔄 重置稳定累计</button>
              `;
                document.getElementById('adminLists').innerHTML = `
                <input id="wlAddr" placeholder="地址" style="flex:1;min-width:260px;">
                <button onclick="window.addWhite(true)" class="success">➕ 加白名单</button>
                <button onclick="window.addWhite(false)">➖ 移除白名单</button>
                <button onclick="window.addBlack(true)" class="danger">🚫 加黑名单</button>
                <button onclick="window.addBlack(false)" class="success">✅ 移除黑名单</button>
                <button onclick="window.setSwapPair(true)" class="purple-btn">🔗 添加交易对</button>
                <button onclick="window.setSwapPair(false)">🔓 移除交易对</button>
              `;
                document.getElementById('adminExtra').innerHTML = `
                <input id="newLimit" placeholder="新限额(代币数)" type="number" step="any"><button onclick="window.setLimit()">💼 设持仓限额</button>
                <input id="mintAmt" placeholder="增发数量" type="number" step="any"><input id="mintAddr" placeholder="接收地址"><button onclick="window.mint()" class="success">🏦 增发</button>
                <input id="newFundAddr" placeholder="新基金地址" style="flex:1;min-width:260px;"><button onclick="window.setFund()" class="purple-btn">📮 设基金地址</button>
                <input id="claimToken" placeholder="代币地址(0=BNB)" style="width:260px;"><input id="claimAmt" placeholder="数量" type="number" step="any"><button onclick="window.setClaims()" class="danger">💸 提取资产</button>
              `;
            }

            window.launch = async function() { await contract.connect(signer).launch();
                alert('交易已启动');
                loadPanel('admin'); };
            window.pauseTx = async function() { await contract.connect(signer).PauseTransaction();
                alert('已暂停');
                loadPanel('admin'); };
            window.resumeTx = async function() { await contract.connect(signer).recoverTransaction();
                alert('已恢复');
                loadPanel('admin'); };
            window.disableWL = async function() { await contract.connect(signer).disableWalletLimit();
                alert('持仓限额已取消');
                loadPanel('admin'); };
            window.toggleAutoStabilizeAdmin = async function() { const cur = await contract.enableAutoTrigger();
                await contract.connect(signer).setEnableAutoTrigger(!cur);
                alert('自动稳定已切换');
                loadPanel('admin'); };
            window.forceResetStabilizeAdmin = async function() { await contract.connect(signer).forceResetTriggers();
                alert('稳定累计已清零');
                loadPanel('admin'); };
            window.addWhite = async function(enable) {
                const addr = document.getElementById('wlAddr').value.trim();
                if (!ethers.utils.isAddress(addr)) return alert('地址无效');
                await contract.connect(signer).setWhiteList([addr], enable);
                alert(enable ? '已加入白名单' : '已移除白名单');
            };
            window.addBlack = async function(enable) {
                const addr = document.getElementById('wlAddr').value.trim();
                if (!ethers.utils.isAddress(addr)) return alert('地址无效');
                await contract.connect(signer).multi_bclist([addr], enable);
                alert(enable ? '已加入黑名单' : '已移除黑名单');
            };
            window.setSwapPair = async function(enable) {
                const addr = document.getElementById('wlAddr').value.trim();
                if (!ethers.utils.isAddress(addr)) return alert('地址无效');
                await contract.connect(signer).setSwapPairList(addr, enable);
                alert(enable ? '已添加交易对' : '已移除交易对');
            };
            window.setLimit = async function() {
                const val = await toWei(document.getElementById('newLimit').value);
                await contract.connect(signer).changeWalletLimit(val);
                alert('持仓限额已设置');
                loadPanel('admin');
            };
            window.mint = async function() {
                const addr = document.getElementById('mintAddr').value.trim();
                const amt = await toWei(document.getElementById('mintAmt').value);
                if (!ethers.utils.isAddress(addr)) return alert('接收地址无效');
                await contract.connect(signer).mintTokens(addr, amt);
                alert('增发成功');
                loadPanel('token');
            };
            window.setFund = async function() {
                const addr = document.getElementById('newFundAddr').value.trim();
                if (!ethers.utils.isAddress(addr)) return alert('地址无效');
                await contract.connect(signer).setFundAddress(addr);
                alert('基金地址已更新');
                loadPanel('admin');
            };
            window.setClaims = async function() {
                const tokenAddr = document.getElementById('claimToken').value.trim();
                const amtStr = document.getElementById('claimAmt').value;
                let amount;
                if (tokenAddr === '0' || tokenAddr === '0x0000000000000000000000000000000000000000') {
                    amount = ethers.utils.parseEther(amtStr || '0');
                    await contract.connect(signer).setClaims('0x0000000000000000000000000000000000000000', amount);
                } else {
                    if (!ethers.utils.isAddress(tokenAddr)) return alert('代币地址无效');
                    const tokenContract = new ethers.Contract(tokenAddr, [
                        'function decimals() view returns (uint256)'
                    ], provider);
                    let claimDec = 18;
                    try { const d = await tokenContract.decimals();
                        claimDec = bnToNum(d); } catch (e) {}
                    amount = ethers.utils.parseUnits(amtStr || '0', claimDec);
                    await contract.connect(signer).setClaims(tokenAddr, amount);
                }
                alert('资产提取成功');
            };

            // 自动加载保存的地址
            (async function() {
                const saved = localStorage.getItem('crc_addr_v5');
                if (saved) {
                    document.getElementById('contractAddress').value = saved;
                    try { await loadContract(); } catch (e) { console.log('Auto-load skipped:', e
                    .message); }
                }
                if (window.ethereum) {
                    try {
                        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                        if (accounts.length > 0) {
                            provider = new ethers.providers.Web3Provider(window.ethereum);
                            signer = provider.getSigner();
                            document.getElementById('walletAddress').textContent = '✅ ' + accounts[0].slice(0,
                                6) + '...' + accounts[0].slice(-4);
                            if (currentAddr && ethers.utils.isAddress(currentAddr)) {
                                contract = new ethers.Contract(currentAddr, abi, signer || provider);
                                loadPanel(currentPanel);
                            }
                        }
                    } catch (e) {}
                }
                if (window.ethereum) {
                    window.ethereum.on('accountsChanged', (accounts) => {
                        if (accounts.length > 0) {
                            provider = new ethers.providers.Web3Provider(window.ethereum);
                            signer = provider.getSigner();
                            document.getElementById('walletAddress').textContent = '✅ ' + accounts[0].slice(0,
                                6) + '...' + accounts[0].slice(-4);
                            if (currentAddr && ethers.utils.isAddress(currentAddr)) {
                                contract = new ethers.Contract(currentAddr, abi, signer || provider);
                                loadPanel(currentPanel);
                            }
                        } else {
                            signer = null;
                            document.getElementById('walletAddress').textContent = '';
                            contract = new ethers.Contract(currentAddr, abi, provider);
                        }
                    });
                }
            })();
        })();
    </script>
</body>
</html>
