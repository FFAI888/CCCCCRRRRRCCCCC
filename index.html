<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRC 代币控制面板 V2.0</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --danger: #f85149; --success: #3fb950; --warn: #d2991d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .title { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .version { background: #21262d; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card h3 { margin-bottom: 12px; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .field { flex: 1 1 160px; margin-bottom: 12px; min-width: 160px; }
    .field label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 0.9rem; }
    .field textarea { resize: vertical; min-height: 50px; }
    .field span { display: block; padding: 8px 0; }
    button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: opacity 0.2s; margin: 4px 6px 4px 0; white-space: nowrap; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: var(--danger); }
    .btn-warn { background: var(--warn); color: #000; }
    .info-text { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
    .success { color: var(--success); }
    .tab-buttons { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab-btn { background: #21262d; color: #8b949e; border: 1px solid var(--border); font-size: 0.85rem; padding: 8px 14px; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; background: #21262d; margin-left: 5px; }
    .badge.active { background: var(--success); color: #000; }
    .badge.inactive { background: var(--danger); }
    .data-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    .data-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .data-table td:first-child { color: #8b949e; width: 180px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 15px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="title">🐼 CRC 代币控制面板</div>
      <div class="version">V2.0 自动转换 · 全数据 · 无遗漏</div>
    </div>
    <div>
      <button id="connectBtn">🔌 连接钱包</button>
      <span id="walletAddress" style="margin-left:10px;"></span>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div class="field"><label>合约地址</label><input type="text" id="contractAddress" placeholder="0x..."></div>
      <button id="loadContractBtn">📄 加载合约</button>
      <span id="networkName" class="info-text"></span>
    </div>
  </div>

  <div class="tab-buttons" id="tabs">
    <button class="tab-btn active" data-tab="overview">📊 概览</button>
    <button class="tab-btn" data-tab="fees">💸 费用管理</button>
    <button class="tab-btn" data-tab="lists">📋 名单</button>
    <button class="tab-btn" data-tab="invite">👥 邀请</button>
    <button class="tab-btn" data-tab="mining">⛏️ LP挖矿</button>
    <button class="tab-btn" data-tab="presale">🎟️ 预售</button>
    <button class="tab-btn" data-tab="control">🎛️ 交易控制</button>
    <button class="tab-btn" data-tab="burn">🔥 底池燃烧</button>
    <button class="tab-btn" data-tab="advanced">⚙️ 高级</button>
    <button class="tab-btn" data-tab="query">🔍 地址查询</button>
  </div>

  <div id="tab-content"><div class="info-text">请连接钱包并加载合约</div></div>
  <div id="globalError" class="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
// ========== 完整 ABI ==========
const ABI = [

  "function symbol() view returns (string)",
  "function decimals() view returns (uint256)",
  "function totalSupply() view returns (uint256)",
  "function balanceOf(address) view returns (uint256)",
  "function owner() view returns (address)",
  "function renounceOwnership()",
  "function transferOwnership(address)",
  "function fundAddress() view returns (address)",
  "function kb() view returns (uint256)",
  "function mineRate() view returns (uint256)",
  "function antiSYNC() view returns (bool)",
  "function _buyFundFee() view returns (uint256)",
  "function _buyLPFee() view returns (uint256)",
  "function buy_burnFee() view returns (uint256)",
  "function _sellFundFee() view returns (uint256)",
  "function _sellLPFee() view returns (uint256)",
  "function sell_burnFee() view returns (uint256)",
  "function removeLiquidityFee() view returns (uint256)",
  "function fristRate() view returns (uint256)",
  "function secondRate() view returns (uint256)",
  "function thirdRate() view returns (uint256)",
  "function leftRate() view returns (uint256)",
  "function generations() view returns (uint256)",
  "function _minTransAmount() view returns (uint256)",
  "function airdropNumbs() view returns (uint256)",
  "function currencyIsEth() view returns (bool)",
  "function startTradeBlock() view returns (uint256)",
  "function enableOffTrade() view returns (bool)",
  "function enableKillBlock() view returns (bool)",
  "function enableRewardList() view returns (bool)",
  "function enableChangeTax() view returns (bool)",
  "function airdropEnable() view returns (bool)",
  "function enablePause() view returns (bool)",
  "function pause() view returns (bool)",
  "function enableMint() view returns (bool)",
  "function enableWalletLimit() view returns (bool)",
  "function maxWalletAmount() view returns (uint256)",
  "function lastLpBurnTime() view returns (uint256)",
  "function lpBurnRate() view returns (uint256)",
  "function lpBurnFrequency() view returns (uint256)",
  "function presaleEnabled() view returns (bool)",
  "function price() view returns (uint256)",
  "function amountPerUnits() view returns (uint256)",
  "function mintLimit() view returns (uint256)",
  "function minted() view returns (uint256)",
  "function _mainPair() view returns (address)",
  "function currency() view returns (address)",
  "function _swapRouter() view returns (address)",
  "function _tokenDistributor() view returns (address)",
  "function _LPRewardDistributor() view returns (address)",
  "function LPRewardCondition() view returns (uint256)",
  "function minLPHoldAmount() view returns (uint256)",
  "function minInvitorHoldAmount() view returns (uint256)",
  "function _mineLPRewardTimeDebt() view returns (uint256)",
  "function _progressMineLPBlockDebt() view returns (uint256)",
  "function _currentMineLPIndex() view returns (uint256)",
  "function _progressMineLPBlock() view returns (uint256)",
  "function getLPProviderLength() view returns (uint256)",
  "function lpProviders(uint256) view returns (address)",
  "function lpProviderIndex(address) view returns (uint256)",
  "function excludeLpProvider(address) view returns (bool)",
  "function _lastMineLPRewardTimes(address) view returns (uint256)",
  "function _userLPAmount(address) view returns (uint256)",
  "function _lastMaybeAddLPAddress() view returns (address)",
  "function _lastMaybeAddLPAmount() view returns (uint256)",
  "function _inviter(address) view returns (address)",
  "function getBinderLength(address) view returns (uint256)",
  "function _binders(address,uint256) view returns (address)",
  "function _feeWhiteList(address) view returns (bool)",
  "function _rewardList(address) view returns (bool)",
  "function _swapPairList(address) view returns (bool)",
  "function setAntiSYNCEnable(bool)",
  "function setkb(uint256)",
  "function setAirDropEnable(bool)",
  "function setFundAddress(address)",
  "function launch()",
  "function setFeeWhiteList(address[],bool)",
  "function completeCustoms(uint256[])",
  "function changeInviteRate(uint256[])",
  "function multi_bclist(address[],bool)",
  "function setMinTransAmount(uint256)",
  "function disableChangeTax()",
  "function setSwapPairList(address,bool)",
  "function claimBalance()",
  "function claimToken(address,uint256,address)",
  "function claimContractToken(address,address,uint256)",
  "function setlpBurnRate(uint256)",
  "function setlpBurnFrequency(uint256)",
  "function setPresaleEnabled(bool)",
  "function setMintLimit(uint256)",
  "function setPrice(uint256)",
  "function setAmountPerUnits(uint256)",
  "function setExcludeLPProvider(address,bool)",
  "function setLPRewardCondition(uint256)",
  "function setMinLPHoldAmount(uint256)",
  "function setMinInvitorHoldAmount(uint256)",
  "function setPause(bool)",
  "function setEnablePause(bool)",
  "function mintToken(address,uint256)",
  "function setEnableMint(bool)",
  "function disableMint()",
  "function setMaxWalletAmount(uint256)",
  "function setEnableWalletLimit(bool)",
  "function disableWalletLimit()"
];

let provider, signer, contract, userAddress, ownerAddress, decimals = 18;
const contractInput = document.getElementById('contractAddress');
const loadBtn = document.getElementById('loadContractBtn');
const connectBtn = document.getElementById('connectBtn');
const walletSpan = document.getElementById('walletAddress');
const errorDiv = document.getElementById('globalError');

// 格式化工具
const fmt = (val, dec = decimals) => ethers.utils.formatUnits(val, dec);
const fmt18 = (val) => ethers.utils.formatUnits(val, 18);
const toDate = (ts) => new Date(ts.toNumber() * 1000).toLocaleString();

window.addEventListener('load', async () => {
  const saved = localStorage.getItem('crc_panel_v2');
  if (saved) contractInput.value = saved;
  if (window.ethereum) {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    const net = await provider.getNetwork();
    document.getElementById('networkName').textContent = '网络: ' + net.name + ' (ID:' + net.chainId + ')';
    const accs = await provider.listAccounts();
    if (accs.length > 0) { signer = provider.getSigner(); userAddress = accs[0]; walletSpan.textContent = userAddress.slice(0,6)+'...'+userAddress.slice(-4); }
  }
});

connectBtn.onclick = async () => {
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();
  userAddress = await signer.getAddress();
  walletSpan.textContent = userAddress.slice(0,6)+'...'+userAddress.slice(-4);
};

loadBtn.onclick = async () => {
  const addr = contractInput.value.trim();
  if (!ethers.utils.isAddress(addr)) return showError('无效地址');
  localStorage.setItem('crc_panel_v2', addr);
  contract = new ethers.Contract(addr, ABI, signer || provider);
  try {
    ownerAddress = await contract.owner();
    decimals = (await contract.decimals()).toNumber();
    loadBtn.textContent = '✅ 已加载';
    renderActiveTab();
  } catch (e) { showError('加载失败: ' + e.message); }
};

function showError(msg) { errorDiv.textContent = msg; setTimeout(() => errorDiv.textContent = '', 5000); }

document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.classList.contains('tab-btn')) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderActiveTab();
  }
});

function renderActiveTab() {
  if (!contract) return;
  const tab = document.querySelector('.tab-btn.active')?.dataset.tab || 'overview';
  renderTabContent(tab);
}

async function renderTabContent(tab) {
  const content = document.getElementById('tab-content');
  content.innerHTML = '加载中...';
  try {
    switch(tab) {
      case 'overview': content.innerHTML = await overviewHTML(); break;
      case 'fees': content.innerHTML = await feesHTML(); break;
      case 'lists': content.innerHTML = await listsHTML(); break;
      case 'invite': content.innerHTML = await inviteHTML(); break;
      case 'mining': content.innerHTML = await miningHTML(); break;
      case 'presale': content.innerHTML = await presaleHTML(); break;
      case 'control': content.innerHTML = await controlHTML(); break;
      case 'burn': content.innerHTML = await burnHTML(); break;
      case 'advanced': content.innerHTML = await advancedHTML(); break;
      case 'query': content.innerHTML = await queryHTML(); break;
    }
    bindEvents(tab);
  } catch (e) { content.innerHTML = `<div class="error">错误: ${e.message}</div>`; }
}

// ============= 模块 HTML 生成（自动转换数据） =============
async function overviewHTML() {
  const [name, sym, total, owner, pair, fund, router, coin, start, currencyIsEth] = await Promise.all([
    contract.name(), contract.symbol(), contract.totalSupply(), contract.owner(), contract._mainPair(),
    contract.fundAddress(), contract._swapRouter(), contract.currency(), contract.startTradeBlock(), contract.currencyIsEth()
  ]);
  const bal = userAddress ? await contract.balanceOf(userAddress) : 0;
  return `
    <table class="data-table">
      <tr><td>名称</td><td>${name}</td></tr>
      <tr><td>符号</td><td>${sym}</td></tr>
      <tr><td>精度</td><td>${decimals}</td></tr>
      <tr><td>总供应</td><td>${fmt(total)}</td></tr>
      <tr><td>我的余额</td><td>${fmt(bal)}</td></tr>
      <tr><td>Owner</td><td class="info-text">${owner}</td></tr>
      <tr><td>主交易对</td><td class="info-text">${pair}</td></tr>
      <tr><td>基金地址</td><td class="info-text">${fund}</td></tr>
      <tr><td>Router</td><td class="info-text">${router}</td></tr>
      <tr><td>交易资产</td><td class="info-text">${coin} (${currencyIsEth?'原生币':'ERC20'})</td></tr>
      <tr><td>开盘区块</td><td>${start} ${start.eq(0)?'<span class="badge inactive">未开盘</span>':'<span class="badge active">已开盘</span>'}</td></tr>
    </table>
    <hr>
    <div class="row">
      <div class="field"><input id="newOwner" placeholder="新 owner 地址"></div>
      <button id="transferOwnerBtn">转移所有权</button>
      <button id="renounceOwnerBtn" class="btn-danger">放弃所有权</button>
    </div>`;
}

async function feesHTML() {
  const [bf, bl, bb, sf, sl, sb, rf, changeTax, anti, minTrans] = await Promise.all([
    contract._buyFundFee(), contract._buyLPFee(), contract.buy_burnFee(),
    contract._sellFundFee(), contract._sellLPFee(), contract.sell_burnFee(),
    contract.removeLiquidityFee(), contract.enableChangeTax(), contract.antiSYNC(),
    contract._minTransAmount()
  ]);
  return `
    <table class="data-table">
      <tr><td>买入基金</td><td>${bf} (${(bf/100).toFixed(2)}%)</td></tr>
      <tr><td>买入流动性</td><td>${bl} (${(bl/100).toFixed(2)}%)</td></tr>
      <tr><td>买入燃烧</td><td>${bb} (${(bb/100).toFixed(2)}%)</td></tr>
      <tr><td>卖出基金</td><td>${sf} (${(sf/100).toFixed(2)}%)</td></tr>
      <tr><td>卖出流动性</td><td>${sl} (${(sl/100).toFixed(2)}%)</td></tr>
      <tr><td>卖出燃烧</td><td>${sb} (${(sb/100).toFixed(2)}%)</td></tr>
      <tr><td>移除流动性费</td><td>${rf} (${(rf/100).toFixed(2)}%)</td></tr>
      <tr><td>最小转账额</td><td>${fmt(minTrans)}</td></tr>
      <tr><td>antiSYNC</td><td><span class="badge ${anti?'active':'inactive'}">${anti?'开':'关'}</span></td></tr>
      <tr><td>税率可修改</td><td><span class="badge ${changeTax?'active':'inactive'}">${changeTax?'是':'永久关闭'}</span></td></tr>
    </table>
    ${changeTax ? `
    <div class="card"><h3>修改费率</h3>
      <div class="row">
        <div class="field"><label>买基金</label><input id="bf_i" value="${bf}"></div>
        <div class="field"><label>买LP</label><input id="bl_i" value="${bl}"></div>
        <div class="field"><label>买烧</label><input id="bb_i" value="${bb}"></div>
        <div class="field"><label>卖基金</label><input id="sf_i" value="${sf}"></div>
        <div class="field"><label>卖LP</label><input id="sl_i" value="${sl}"></div>
        <div class="field"><label>卖烧</label><input id="sb_i" value="${sb}"></div>
      </div>
      <button id="applyFeesBtn">应用新费率</button>
      <button id="disableTaxBtn" class="btn-warn">永久关闭修改</button>
    </div>` : ''}
    <div class="row">
      <div class="field"><label>最小转账额(wei)</label><input id="minTrans_i" value="${minTrans}"></div>
      <button id="setMinTransBtn">设置</button>
      <div class="field"><label>antiSYNC</label><select id="antiSync_i"><option value="true" ${anti?'selected':''}>开</option><option value="false" ${!anti?'selected':''}>关</option></select><button id="setAntiSyncBtn">应用</button></div>
    </div>
    <div class="info-text">举例：买入1000枚，买基金2%买LP2%买烧1% → 扣20,20,10，到账950</div>`;
}

async function listsHTML() {
  return `
    <div class="card"><h3>名单查询</h3>
      <div class="row"><input id="listAddr" placeholder="0x..."><button id="queryListBtn">查询</button></div>
      <div id="listResult" class="info-text"></div>
    </div>
    <div class="card"><h3>批量白名单</h3>
      <div class="row"><textarea id="feeAddrs" rows="2" placeholder="地址用逗号或换行分隔"></textarea><select id="feeEnable"><option value="true">加入</option><option value="false">移除</option></select><button id="setFeeListBtn">执行</button></div>
    </div>
    <div class="card"><h3>奖励黑名单</h3>
      <div class="row"><textarea id="bcAddrs" rows="2" placeholder="地址(最多200)"></textarea><select id="bcEnable"><option value="true">加入</option><option value="false">移除</option></select><button id="setBcListBtn">执行</button></div>
    </div>
    <div class="card"><h3>交易对列表</h3>
      <div class="row"><input id="pairAddr_i" placeholder="交易对地址"><select id="pairEnable_i"><option value="true">启用</option><option value="false">禁用</option></select><button id="setPairBtn">设置</button></div>
    </div>`;
}

async function inviteHTML() {
  const [gen, f, s, t, l, minInv] = await Promise.all([
    contract.generations(), contract.fristRate(), contract.secondRate(), contract.thirdRate(), contract.leftRate(), contract.minInvitorHoldAmount()
  ]);
  return `
    <table class="data-table">
      <tr><td>代数</td><td>${gen}</td></tr>
      <tr><td>一代比例</td><td>${f}%</td></tr>
      <tr><td>二代比例</td><td>${s}%</td></tr>
      <tr><td>三代比例</td><td>${t}%</td></tr>
      <tr><td>后续代数统一</td><td>${l}%</td></tr>
      <tr><td>邀请人最低持仓</td><td>${fmt(minInv)}</td></tr>
    </table>
    <div class="card"><h3>修改</h3>
      <div class="row">
        <div class="field"><label>代数</label><input id="gen_i" value="${gen}"></div>
        <div class="field"><label>一代%</label><input id="f_i" value="${f}"></div>
        <div class="field"><label>二代%</label><input id="s_i" value="${s}"></div>
        <div class="field"><label>三代%</label><input id="t_i" value="${t}"></div>
        <div class="field"><label>后续%</label><input id="l_i" value="${l}"></div>
      </div>
      <button id="applyInviteBtn">应用比例</button>
      <div class="row"><input id="minInv_i" value="${minInv}" placeholder="wei"><button id="setMinInvBtn">设置最低持仓</button></div>
      <div id="inviteError" class="error"></div>
    </div>
    <div class="card"><h3>邀请关系查询</h3>
      <div class="row"><input id="invQueryAddr" placeholder="地址"><button id="queryInvBtn">查询</button></div>
      <div id="invQueryResult" class="info-text"></div>
    </div>`;
}

async function miningHTML() {
  const [rate, cond, minLP, minInv, timeDebt, blockDebt, curIdx, progBlock, lpLen] = await Promise.all([
    contract.mineRate(), contract.LPRewardCondition(), contract.minLPHoldAmount(),
    contract.minInvitorHoldAmount(), contract._mineLPRewardTimeDebt(), contract._progressMineLPBlockDebt(),
    contract._currentMineLPIndex(), contract._progressMineLPBlock(), contract.getLPProviderLength()
  ]);
  return `
    <table class="data-table">
      <tr><td>挖矿比例</td><td>${rate}%</td></tr>
      <tr><td>基础奖励</td><td>${fmt(cond)}</td></tr>
      <tr><td>最小LP持仓</td><td>${fmt(minLP)}</td></tr>
      <tr><td>邀请最低持仓</td><td>${fmt(minInv)}</td></tr>
      <tr><td>地址冷却时间</td><td>${timeDebt} 秒</td></tr>
      <tr><td>进度块间隔</td><td>${blockDebt} 块</td></tr>
      <tr><td>当前索引</td><td>${curIdx}</td></tr>
      <tr><td>上次进度块</td><td>${progBlock}</td></tr>
      <tr><td>LP提供者数量</td><td>${lpLen}</td></tr>
    </table>
    <div class="card"><h3>设置</h3>
      <div class="row">
        <div class="field"><label>基础奖励(wei)</label><input id="cond_i" value="${cond}"></div><button id="setCondBtn">设置</button>
        <div class="field"><label>最小LP(wei)</label><input id="minLP_i" value="${minLP}"></div><button id="setMinLPBtn">设置</button>
      </div>
    </div>
    <div class="card"><h3>LP提供者</h3>
      <div class="row"><input id="lpIdx" type="number" placeholder="索引"><button id="queryLpBtn">查询</button></div>
      <div id="lpResult" class="info-text"></div>
      <div class="row"><input id="excludeAddr" placeholder="地址"><select id="excludeEnable"><option value="true">排除</option><option value="false">取消</option></select><button id="setExcludeBtn">设置</button></div>
    </div>`;
}

async function presaleHTML() {
  const [en, price, perUnit, limit, minted] = await Promise.all([
    contract.presaleEnabled(), contract.price(), contract.amountPerUnits(), contract.mintLimit(), contract.minted()
  ]);
  return `
    <table class="data-table">
      <tr><td>预售开关</td><td><span class="badge ${en?'active':'inactive'}">${en?'开启':'关闭'}</span></td></tr>

// ============= 事件绑定 =============
function bindEvents(tab) {
  const $$ = (id, handler) => { const el = document.getElementById(id); if(el) el.onclick = handler; };

  $$('transferOwnerBtn', async () => {
    if (!checkOwner()) return;
    const addr = document.getElementById('newOwner').value;
    if (!ethers.utils.isAddress(addr)) return alert('无效地址');
    await sendTx(contract.transferOwnership(addr), '所有权转移成功');
  });
  $$('renounceOwnerBtn', async () => {
    if (!checkOwner()) return;
    if (!confirm('确定放弃所有权？不可逆！')) return;
    await sendTx(contract.renounceOwnership(), '已放弃所有权');
  });

  // 费用
  $$('applyFeesBtn', async () => {
    if (!checkOwner()) return;
    const vals = ['bf_i','bl_i','bb_i','sf_i','sl_i','sb_i'].map(id => Number(document.getElementById(id).value));
    if (vals.some(v => isNaN(v) || v<0)) return alert('请输入有效数字');
    const buySum = vals[0]+vals[1]+vals[2], sellSum = vals[3]+vals[4]+vals[5];
    if (buySum >= 2500 || sellSum >= 2500) return alert('买入或卖出总费率需 < 2500');
    await sendTx(contract.completeCustoms(vals), '费率已更新');
  });
  $$('disableTaxBtn', async () => { if(checkOwner()) await sendTx(contract.disableChangeTax(), '已永久关闭税率修改'); });
  $$('setMinTransBtn', async () => {
    if (!checkOwner()) return;
    await sendTx(contract.setMinTransAmount(document.getElementById('minTrans_i').value));
  });
  $$('setAntiSyncBtn', async () => {
    if (!checkOwner()) return;
    await sendTx(contract.setAntiSYNCEnable(document.getElementById('antiSync_i').value === 'true'));
  });

  // 名单
  $$('queryListBtn', async () => {
    const addr = document.getElementById('listAddr').value;
    if (!ethers.utils.isAddress(addr)) return;
    const [fw, rw, sp, inv, lp] = await Promise.all([
      contract._feeWhiteList(addr), contract._rewardList(addr), contract._swapPairList(addr),
      contract._inviter(addr), contract._userLPAmount(addr)
    ]);
    document.getElementById('listResult').innerHTML = `白名单: ${fw} | 黑名单: ${rw} | 交易对: ${sp} | 邀请人: ${inv||'无'} | LP: ${fmt(lp)}`;
  });
  $$('setFeeListBtn', async () => {
    if (!checkOwner()) return;
    const addrs = document.getElementById('feeAddrs').value.split(/[,\n]+/).filter(a => ethers.utils.isAddress(a.trim()));
    if (!addrs.length) return alert('无有效地址');
    const enable = document.getElementById('feeEnable').value === 'true';
    await sendTx(contract.setFeeWhiteList(addrs, enable));
  });
  $$('setBcListBtn', async () => {
    if (!checkOwner()) return;
    const addrs = document.getElementById('bcAddrs').value.split(/[,\n]+/).filter(a => ethers.utils.isAddress(a.trim()));
    if (addrs.length===0 || addrs.length>200) return alert('地址数1-200');
    await sendTx(contract.multi_bclist(addrs, document.getElementById('bcEnable').value === 'true'));
  });
  $$('setPairBtn', async () => {
    if (!checkOwner()) return;
    const addr = document.getElementById('pairAddr_i').value;
    if (!ethers.utils.isAddress(addr)) return alert('无效地址');
    await sendTx(contract.setSwapPairList(addr, document.getElementById('pairEnable_i').value === 'true'));
  });

  // 邀请
  $$('applyInviteBtn', async () => {
    if (!checkOwner()) return;
    const vals = ['gen_i','f_i','s_i','t_i','l_i'].map(id => Number(document.getElementById(id).value));
    if (vals.some(v => isNaN(v) || v<0)) return alert('请输入有效数字');
    const [gen, f, s, t, l] = vals;
    if (f + s + t + l * Math.max(0, gen-3) !== 100) return alert('比例总和需为100');
    await sendTx(contract.changeInviteRate(vals));
  });
  $$('setMinInvBtn', async () => {
    if (!checkOwner()) return;
    await sendTx(contract.setMinInvitorHoldAmount(document.getElementById('minInv_i').value));
  });
  $$('queryInvBtn', async () => {
    const addr = document.getElementById('invQueryAddr').value;
    if (!ethers.utils.isAddress(addr)) return;
    const inv = await contract._inviter(addr);
    const len = await contract.getBinderLength(addr);
    document.getElementById('invQueryResult').innerHTML = `邀请人: ${inv||'无'} | 下级数量: ${len}`;
  });

  // 挖矿
  $$('setCondBtn', async () => { if(checkOwner()) await sendTx(contract.setLPRewardCondition(document.getElementById('cond_i').value)); });
  $$('setMinLPBtn', async () => { if(checkOwner()) await sendTx(contract.setMinLPHoldAmount(document.getElementById('minLP_i').value)); });
  $$('queryLpBtn', async () => {
    const idx = Number(document.getElementById('lpIdx').value);
    const len = await contract.getLPProviderLength();
    if (idx>=len) return alert('索引超范围');
    const addr = await contract.lpProviders(idx);
    const [lpBal, userLP, lastTime] = await Promise.all([
      new ethers.Contract(await contract._mainPair(), ['function balanceOf(address) view returns (uint256)'], provider).balanceOf(addr),
      contract._userLPAmount(addr),
      contract._lastMineLPRewardTimes(addr)
    ]);
    document.getElementById('lpResult').innerHTML = `地址: ${addr} | LP余额: ${fmt(lpBal)} | 用户LP: ${fmt(userLP)} | 上次挖矿: ${lastTime.eq(0)?'无':toDate(lastTime)}`;
  });
  $$('setExcludeBtn', async () => {
    if (!checkOwner()) return;
    const addr = document.getElementById('excludeAddr').value;
    if (!ethers.utils.isAddress(addr)) return;
    await sendTx(contract.setExcludeLPProvider(addr, document.getElementById('excludeEnable').value === 'true'));
  });

  // 预售
  $$('setPresaleBtn', async () => { if(checkOwner()) await sendTx(contract.setPresaleEnabled(document.getElementById('presaleEn').value==='true')); });
  $$('setPriceBtn', async () => { if(checkOwner()) await sendTx(contract.setPrice(document.getElementById('price_i').value)); });
  $$('setPerUnitBtn', async () => { if(checkOwner()) await sendTx(contract.setAmountPerUnits(document.getElementById('perUnit_i').value)); });
  $$('setLimitBtn', async () => { if(checkOwner()) await sendTx(contract.setMintLimit(document.getElementById('limit_i').value)); });

  // 控制
  $$('launchBtn', async () => { if(checkOwner()) await sendTx(contract.launch(), '已开盘'); });
  $$('pauseBtn', async () => { if(checkOwner()) await sendTx(contract.setPause(!(await contract.pause()))); });
  $$('setKbBtn', async () => { if(checkOwner()) await sendTx(contract.setkb(document.getElementById('kb_i').value)); });
  $$('setAirdropBtn', async () => { if(checkOwner()) await sendTx(contract.setAirDropEnable(document.getElementById('airdrop_i').value==='true')); });
  $$('setMinTrans2Btn', async () => { if(checkOwner()) await sendTx(contract.setMinTransAmount(document.getElementById('minTrans2_i').value)); });
  $$('setMaxWBtn', async () => { if(checkOwner()) await sendTx(contract.setMaxWalletAmount(document.getElementById('maxW_i').value)); });
  $$('setWalletEnBtn', async () => { if(checkOwner()) await sendTx(contract.setEnableWalletLimit(document.getElementById('walletEn_i').value==='true')); });
  $$('disableWalletBtn', async () => { if(checkOwner()) await sendTx(contract.disableWalletLimit()); });

  // 燃烧
  $$('setBurnRateBtn', async () => {
    if (!checkOwner()) return;
    const val = Number(document.getElementById('burnRate_i').value);
    if (val>100) return alert('≤100');
    await sendTx(contract.setlpBurnRate(val));
  });
  $$('setBurnFreqBtn', async () => {
    if (!checkOwner()) return;
    const h = Number(document.getElementById('burnFreqH').value);
    if (isNaN(h) || h<=0) return alert('无效小时数');
    await sendTx(contract.setlpBurnFrequency(h * 3600));
  });

  // 高级
  $$('setEnablePauseBtn', async () => { if(checkOwner()) await sendTx(contract.setEnablePause(document.getElementById('enablePause_i').value==='true')); });
  $$('setEnableMintBtn', async () => { if(checkOwner()) await sendTx(contract.setEnableMint(document.getElementById('enableMint_i').value==='true')); });
  $$('disableMintBtn', async () => { if(checkOwner()) await sendTx(contract.disableMint()); });
  $$('mintTokenBtn', async () => {
    if (!checkOwner()) return;
    const addr = document.getElementById('mintAddr').value;
    const amt = document.getElementById('mintAmt').value;
    if (!ethers.utils.isAddress(addr)) return alert('无效地址');
    await sendTx(contract.mintToken(addr, amt));
  });
  $$('claimBalanceBtn', async () => { if(checkOwner()) await sendTx(contract.claimBalance()); });
  $$('claimTokenBtn', async () => {
    if (!checkOwner()) return;
    const t = document.getElementById('claimTokenAddr').value;
    const a = document.getElementById('claimAmt').value;
    const to = document.getElementById('claimTo').value;
    if (!ethers.utils.isAddress(t) || !ethers.utils.isAddress(to)) return alert('地址无效');
    await sendTx(contract.claimToken(t, a, to));
  });
  $$('claimDistBtn', async () => {
    if (!checkOwner()) return;
    const dist = document.getElementById('claimDistAddr').value;
    const t = document.getElementById('claimDistToken').value;
    if (!ethers.utils.isAddress(dist) || !ethers.utils.isAddress(t)) return alert('地址无效');
    const amount = ethers.constants.MaxUint256; // 提取全部
    await sendTx(contract.claimContractToken(dist, t, amount));
  });

  // 查询
  $$('doQueryBtn', async () => {
    const addr = document.getElementById('queryMapAddr').value;
    if (!ethers.utils.isAddress(addr)) return;
    const [fw, rw, sp, inv, lp, lpTime, isLpProv, lpIdx] = await Promise.all([
      contract._feeWhiteList(addr), contract._rewardList(addr), contract._swapPairList(addr),
      contract._inviter(addr), contract._userLPAmount(addr), contract._lastMineLPRewardTimes(addr),
      contract.excludeLpProvider(addr).then(r => !r), contract.lpProviderIndex(addr)
    ]);
    document.getElementById('mapResult').innerHTML = `
      <b>${addr}</b><br>
      白名单: ${fw} | 黑名单: ${rw} | 交易对: ${sp}<br>
      邀请人: ${inv||'无'}<br>
      LP数量: ${fmt(lp)} | 上次挖矿: ${lpTime.eq(0)?'无':toDate(lpTime)}<br>
      LP提供者: ${isLpProv ? '是 (索引'+lpIdx+')' : '否或已排除'}
    `;
    // 内部状态
    const [lastMaybeLP, lastMaybeAmt, pairTotal, pairReserves] = await Promise.all([
      contract._lastMaybeAddLPAddress(), contract._lastMaybeAddLPAmount(),
      new ethers.Contract(await contract._mainPair(), ['function totalSupply() view returns (uint256)'], provider).totalSupply(),
      new ethers.Contract(await contract._mainPair(), ['function getReserves() view returns (uint112,uint112,uint32)'], provider).getReserves()
    ]);
    document.getElementById('internalState').innerHTML = `
      <tr><td>最后可能加池地址</td><td>${lastMaybeLP}</td></tr>
      <tr><td>最后可能加池量</td><td>${fmt(lastMaybeAmt)}</td></tr>
      <tr><td>交易对总LP</td><td>${fmt(pairTotal)}</td></tr>
      <tr><td>储备0</td><td>${pairReserves[0]}</td></tr>
      <tr><td>储备1</td><td>${pairReserves[1]}</td></tr>
    `;
  });

  if (tab === 'query') { // 无地址时也显示内部状态
    (async () => {
      const [lastMaybeLP, lastMaybeAmt, pairTotal, pairReserves] = await Promise.all([
        contract._lastMaybeAddLPAddress(), contract._lastMaybeAddLPAmount(),
        new ethers.Contract(await contract._mainPair(), ['function totalSupply() view returns (uint256)'], provider).totalSupply(),
        new ethers.Contract(await contract._mainPair(), ['function getReserves() view returns (uint112,uint112,uint32)'], provider).getReserves()
      ]);
      document.getElementById('internalState').innerHTML = `
        <tr><td>最后可能加池地址</td><td>${lastMaybeLP}</td></tr>
        <tr><td>最后可能加池量</td><td>${fmt(lastMaybeAmt)}</td></tr>
        <tr><td>交易对总LP</td><td>${fmt(pairTotal)}</td></tr>
        <tr><td>储备0</td><td>${pairReserves[0]}</td></tr>
        <tr><td>储备1</td><td>${pairReserves[1]}</td></tr>
      `;
    })();
  }
}

function checkOwner() {
  if (!userAddress || !ownerAddress) { alert('请先连接钱包并加载合约'); return false; }
  if (userAddress.toLowerCase() !== ownerAddress.toLowerCase()) { alert('仅合约 Owner 可操作'); return false; }
  return true;
}

async function sendTx(txPromise, successMsg) {
  try {
    const tx = await txPromise;
    await tx.wait();
    if (successMsg) alert(successMsg);
    renderActiveTab();
  } catch (e) {
    if (e.code === 'UNPREDICTABLE_GAS_LIMIT') {
      showError('交易失败：参数可能不满足合约约束，或你不是 Owner');
    } else {
      showError(e.message);
    }
  }
}
</script>
