<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRC 稳定控制面板 v4.0</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0e17; --card: #111827; --border: #1f2a3a;
            --text: #e2e8f0; --text2: #94a3b8; --accent: #3b82f6;
            --accent2: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .header h1 { font-size: 2rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .version { background: var(--accent); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 1.3rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--accent); }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        input, select, button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: #1e293b; color: var(--text); font-size: 0.95rem; }
        button { cursor: pointer; background: var(--accent); border: none; font-weight: 600; transition: all 0.2s; }
        button:hover { filter: brightness(1.15); }
        button.danger { background: var(--danger); }
        button.success { background: var(--accent2); }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
        .data-item { background: #0f172a; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); }
        .data-item label { font-size: 0.75rem; color: var(--text2); margin-bottom: 5px; display: block; }
        .data-item span { font-size: 1.1rem; font-weight: 600; word-break: break-all; }
        .tooltip { position: relative; cursor: help; border-bottom: 1px dashed var(--text2); font-size: 0.85rem; }
        .tooltip::after { content: attr(data-tip); position: absolute; left: 0; top: 110%; background: #1e293b; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; width: max-content; max-width: 300px; z-index: 100; opacity: 0; visibility: hidden; transition: 0.2s; border: 1px solid var(--border); }
        .tooltip:hover::after { opacity: 1; visibility: visible; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { background: #1e293b; border: 1px solid var(--border); color: var(--text2); padding: 8px 20px; border-radius: 10px; cursor: pointer; }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .hidden { display: none; }
        .wallet-btn { background: var(--accent2); }
        .refresh-btn { background: #475569; }
        .status-text { font-size: 0.85rem; margin-left: 10px; }
        hr { border-color: var(--border); margin: 20px 0; }
        @media (max-width: 768px) { .header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <h1>🛡️ CRC 稳定控制面板</h1>
            <span class="version">v4.0</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="connectWallet" class="wallet-btn">🔌 连接钱包</button>
            <span id="walletAddress" style="font-size:0.9rem; color: var(--text2)"></span>
        </div>
    </div>

    <div class="card">
        <div class="input-group">
            <input type="text" id="contractAddress" placeholder="输入 PandaTokenV4 合约地址" style="flex:1; min-width:300px;">
            <button id="loadContract" class="success">📦 加载合约</button>
            <button id="saveAddress" class="refresh-btn">💾 保存地址</button>
            <span style="font-size:0.8rem; color: var(--text2)">（自动保存）</span>
        </div>
        <div id="contractStatus" style="margin-top: 10px; color: var(--warning);"></div>
    </div>

    <div class="tabs" id="tabGroup">
        <div class="tab active" data-tab="token">📊 代币</div>
        <div class="tab" data-tab="tax">🧾 税率</div>
        <div class="tab" data-tab="stabilize">⚖️ 稳定</div>
        <div class="tab" data-tab="lp">💧 挖矿</div>
        <div class="tab" data-tab="invite">👥 邀请</div>
        <div class="tab" data-tab="advanced">⚙️ 高级</div>
        <div class="tab" data-tab="admin">🛡️ 管理</div>
    </div>

    <!-- 面板容器 -->
    <div id="panel-token" class="card"><h2>📊 代币数据 <span id="status-token" class="status-text"></span></h2><div class="data-grid" id="tokenData"></div></div>
    <div id="panel-tax" class="card hidden"><h2>🧾 税率配置 <span id="status-tax" class="status-text"></span></h2><div class="data-grid" id="taxData"></div><hr><h3>✏️ 修改税率</h3><div class="input-group" id="taxSetters"></div></div>
    <div id="panel-stabilize" class="card hidden"><h2>⚖️ 稳定机制 <span id="status-stabilize" class="status-text"></span></h2><div class="data-grid" id="stabilizeData"></div><hr><h3>✏️ 设置参数</h3><div class="input-group" id="stabilizeSetters"></div></div>
    <div id="panel-lp" class="card hidden"><h2>💧 LP 挖矿 <span id="status-lp" class="status-text"></span></h2><div class="data-grid" id="lpData"></div><hr><h3>✏️ 设置</h3><div class="input-group" id="lpSetters"></div></div>
    <div id="panel-invite" class="card hidden"><h2>👥 邀请系统 <span id="status-invite" class="status-text"></span></h2><div class="data-grid" id="inviteData"></div><hr><h3>✏️ 设置</h3><div class="input-group" id="inviteSetters"></div></div>
    <div id="panel-advanced" class="card hidden"><h2>⚙️ 高级控制 <span id="status-advanced" class="status-text"></span></h2><div class="data-grid" id="advancedData"></div><hr><h3>✏️ 设置</h3><div class="input-group" id="advancedSetters"></div></div>
    <div id="panel-admin" class="card hidden"><h2>🛡️ 管理员操作 <span id="status-admin" class="status-text"></span></h2><div class="data-grid" id="adminData"></div><div class="input-group" id="adminActions" style="margin-top:15px;"></div></div>
</div>

<script>
// ==================== 初始化 ====================
const BSC_RPC = "https://bsc-dataseed.binance.org/";
let provider = new ethers.providers.JsonRpcProvider(BSC_RPC);
let signer = null;
let contract = null;
let currentAddr = "";
let currentPanel = "token";

// 完整ABI（与合约一一对应，包含所有view和写入函数）
const abi = [
  "function name() view returns (string)",
  "function symbol() view returns (string)",
  "function decimals() view returns (uint256)",
  "function totalSupply() view returns (uint256)",
  "function balanceOf(address) view returns (uint256)",
  "function getCirculatingSupply() view returns (uint256)",
  "function owner() view returns (address)",
  "function _mainPair() view returns (address)",
  "function fundAddress() view returns (address)",
  "function _allWhiteList(address) view returns (bool)",
  "function _rewardList(address) view returns (bool)",
  "function enableMint() view returns (bool)",
  "function enablePause() view returns (bool)",
  "function enableRewardList() view returns (bool)",
  "function enableWalletLimit() view returns (bool)",
  "function pause() view returns (bool)",
  "function _buyFundFee() view returns (uint256)",
  "function _buyLPFee() view returns (uint256)",
  "function buy_burnFee() view returns (uint256)",
  "function _sellFundFee() view returns (uint256)",
  "function _sellLPFee() view returns (uint256)",
  "function sell_burnFee() view returns (uint256)",
  "function addLiquidityFee() view returns (uint256)",
  "function removeLiquidityFee() view returns (uint256)",
  "function numTokensSellRate() view returns (uint256)",
  "function antiSYNC() view returns (bool)",
  "function enableOffTrade() view returns (bool)",
  "function enableKillBlock() view returns (bool)",
  "function kb() view returns (uint256)",
  "function startTradeBlock() view returns (uint256)",
  "function airdropEnable() view returns (bool)",
  "function airdropNumbs() view returns (uint256)",
  "function limitAddLiquidity() view returns (bool)",
  "function totalBuyAmount() view returns (uint256)",
  "function totalSellAmount() view returns (uint256)",
  "function buyTriggerThreshold() view returns (uint256)",
  "function sellTriggerThreshold() view returns (uint256)",
  "function triggerActionPercent() view returns (uint256)",
  "function maxDailyTriggers() view returns (uint8)",
  "function dailyTriggerCount() view returns (uint8)",
  "function triggerCooldown() view returns (uint256)",
  "function cooldownRemaining() view returns (uint256)",
  "function enableAutoTrigger() view returns (bool)",
  "function lastLpBurnTime() view returns (uint256)",
  "function lpBurnRate() view returns (uint256)",
  "function lpBurnFrequency() view returns (uint256)",
  "function mineRate() view returns (uint256)",
  "function LPRewardCondition() view returns (uint256)",
  "function minLPHoldAmount() view returns (uint256)",
  "function minInvitorHoldAmount() view returns (uint256)",
  "function _LPRewardDistributor() view returns (address)",
  "function generations() view returns (uint256)",
  "function fristRate() view returns (uint256)",
  "function secondRate() view returns (uint256)",
  "function thirdRate() view returns (uint256)",
  "function leftRate() view returns (uint256)",
  "function _minTransAmount() view returns (uint256)",
  "function enableChangeTax() view returns (bool)",
  "function maxWalletAmount() view returns (uint256)",
  "function completeCustoms(uint256[]) external",
  "function setAutoTriggerParams(uint256,uint256,uint256,uint8,uint256) external",
  "function setLPRewardCondition(uint256) external",
  "function setMinLPHoldAmount(uint256) external",
  "function setMinInvitorHoldAmount(uint256) external",
  "function changeInviteRate(uint256[]) external",
  "function launch() external",
  "function PauseTransaction() external",
  "function recoverTransaction() external",
  "function disableWalletLimit() external",
  "function changeWalletLimit(uint256) external",
  "function setEnableAutoTrigger(bool) external",
  "function setLimitAddLiquidity(bool) external",
  "function setlpBurnRate(uint256) external",
  "function setlpBurnFrequency(uint256) external",
  "function setAirDropEnable(bool) external",
  "function setAirdropNumbs(uint256) external",
  "function setkb(uint256) external",
  "function setAntiSYNCEnable(bool) external",
  "function setNumTokensSellRate(uint256) external",
  "function disableChangeTax() external",
  "function setWhiteList(address[],bool) external",
  "function multi_bclist(address[],bool) external",
  "function mintTokens(address,uint256) external",
  "function forceResetTriggers() external",
  "function setSwapPairList(address,bool) external",
  "function setMinTransAmount(uint256) external",
  "function setFundAddress(address) external",
  "function setAddLiquidityFee(uint256) external",
  "function setRemoveLiquidityFee(uint256) external",
  "function setExcludeLPProvider(address,bool) external"
];

// 工具函数
async function toWei(val, dec = 18) {
  try { return ethers.utils.parseUnits(val.toString(), dec); } catch (e) { return ethers.BigNumber.from(0); }
}
function fromWei(val, dec = 18) {
  try { return ethers.utils.formatUnits(val, dec); } catch (e) { return val.toString(); }
}
function basisToPercent(basis) { return (basis / 100).toFixed(2) + '%'; }

// 状态提示
function setStatus(panel, msg, isErr = false) {
  const el = document.getElementById(`status-${panel}`);
  if (!el) return;
  el.textContent = msg;
  el.style.color = isErr ? 'var(--danger)' : 'var(--accent2)';
  if (!msg.includes('❌')) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

// 标签切换
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentPanel = tab.dataset.tab;
    document.querySelectorAll('[id^="panel-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById(`panel-${currentPanel}`).classList.remove('hidden');
    loadPanel(currentPanel);
  });
});

// 按钮事件
document.getElementById('connectWallet').onclick = async () => {
  if (!window.ethereum) return alert('请安装MetaMask');
  await window.ethereum.request({ method: 'eth_requestAccounts' });
  provider = new ethers.providers.Web3Provider(window.ethereum);
  signer = provider.getSigner();
  document.getElementById('walletAddress').textContent = '✅ ' + (await signer.getAddress()).slice(0,6)+'...';
};
document.getElementById('loadContract').onclick = loadContract;
document.getElementById('saveAddress').onclick = () => {
  const addr = document.getElementById('contractAddress').value.trim();
  if (addr) localStorage.setItem('crc_addr_v4', addr);
};

async function loadContract() {
  const addr = document.getElementById('contractAddress').value.trim();
  if (!ethers.utils.isAddress(addr)) return alert('地址无效');
  currentAddr = addr;
  localStorage.setItem('crc_addr_v4', addr);
  if (!signer) {
    try { await window.ethereum.request({ method: 'eth_requestAccounts' }); provider = new ethers.providers.Web3Provider(window.ethereum); signer = provider.getSigner(); } catch(e) {}
  }
  contract = new ethers.Contract(addr, abi, signer || provider);
  document.getElementById('contractStatus').textContent = '✅ 合约已加载';
  loadPanel(currentPanel);
}

// 面板加载入口
async function loadPanel(panel) {
  if (!contract) return alert('请先加载合约');
  setStatus(panel, '⏳ 加载中...');
  try {
    switch(panel) {
      case 'token': await loadToken(); break;
      case 'tax': await loadTax(); break;
      case 'stabilize': await loadStabilize(); break;
      case 'lp': await loadLP(); break;
      case 'invite': await loadInvite(); break;
      case 'advanced': await loadAdvanced(); break;
      case 'admin': await loadAdmin(); break;
    }
    setStatus(panel, '✅ 已更新');
  } catch(e) {
    setStatus(panel, '❌ ' + e.message, true);
    console.error(e);
  }
}

// -------------------- 代币数据 --------------------
async function loadToken() {
  const [name, sym, dec, total, circ, pair, own, pairBal] = await Promise.all([
    contract.name(), contract.symbol(), contract.decimals(), contract.totalSupply(),
    contract.getCirculatingSupply(), contract._mainPair(), contract.owner(),
    contract.balanceOf(await contract._mainPair())
  ]);
  document.getElementById('tokenData').innerHTML = `
    <div class="data-item"><label>名称</label><span>${name}</span></div>
    <div class="data-item"><label>符号</label><span>${sym}</span></div>
    <div class="data-item"><label>精度</label><span>${dec}</span></div>
    <div class="data-item"><label>总供应</label><span>${fromWei(total)}</span></div>
    <div class="data-item"><label>流通量</label><span>${fromWei(circ)}</span></div>
    <div class="data-item"><label>交易对</label><span>${pair}</span></div>
    <div class="data-item"><label>池子余额</label><span>${fromWei(pairBal)}</span></div>
    <div class="data-item"><label>Owner</label><span>${own}</span></div>
  `;
}

// -------------------- 税率 --------------------
async function loadTax() {
  const [bf, blp, bb, sf, slp, sb, add, rem, chTax] = await Promise.all([
    contract._buyFundFee(), contract._buyLPFee(), contract.buy_burnFee(),
    contract._sellFundFee(), contract._sellLPFee(), contract.sell_burnFee(),
    contract.addLiquidityFee(), contract.removeLiquidityFee(), contract.enableChangeTax()
  ]);
  document.getElementById('taxData').innerHTML = `
    <div class="data-item"><label>买入基金 <span class="tooltip" data-tip="基点,100=1%">ⓘ</span></label><span>${bf} (${basisToPercent(bf)})</span></div>
    <div class="data-item"><label>买入LP</label><span>${blp} (${basisToPercent(blp)})</span></div>
    <div class="data-item"><label>买入销毁</label><span>${bb} (${basisToPercent(bb)})</span></div>
    <div class="data-item"><label>卖出基金</label><span>${sf} (${basisToPercent(sf)})</span></div>
    <div class="data-item"><label>卖出LP</label><span>${slp} (${basisToPercent(slp)})</span></div>
    <div class="data-item"><label>卖出销毁</label><span>${sb} (${basisToPercent(sb)})</span></div>
    <div class="data-item"><label>添加流动性税</label><span>${add} (${basisToPercent(add)})</span></div>
    <div class="data-item"><label>移除流动性税</label><span>${rem} (${basisToPercent(rem)})</span></div>
    <div class="data-item"><label>税率可修改</label><span>${chTax ? '✅' : '❌ 永久锁定'}</span></div>
  `;
  document.getElementById('taxSetters').innerHTML = `
    <input id="tx1" placeholder="买入基金(基点)"><input id="tx2" placeholder="买入LP(基点)">
    <input id="tx3" placeholder="买入销毁(基点)"><input id="tx4" placeholder="卖出基金(基点)">
    <input id="tx5" placeholder="卖出LP(基点)"><input id="tx6" placeholder="卖出销毁(基点)">
    <button onclick="setTaxes()">✏️ 更新税率</button>
    <span class="tooltip" data-tip="需Owner权限。基点，如100=1%。买入三税和≤2500，卖出三税和≤2500">ⓘ</span>
  `;
}

async function setTaxes() {
  const vals = ['tx1','tx2','tx3','tx4','tx5','tx6'].map(id => document.getElementById(id).value);
  if (vals.some(v => isNaN(v) || v==='')) return alert('请输入有效数字');
  await contract.connect(signer).completeCustoms(vals.map(Number));
  alert('税率已更新'); loadPanel('tax');
}

// -------------------- 稳定机制 --------------------
async function loadStabilize() {
  const [buyAmt, sellAmt, buyTh, sellTh, perc, maxD, daily, cd, cool, en] = await Promise.all([
    contract.totalBuyAmount(), contract.totalSellAmount(), contract.buyTriggerThreshold(),
    contract.sellTriggerThreshold(), contract.triggerActionPercent(),
    contract.maxDailyTriggers(), contract.dailyTriggerCount(), contract.triggerCooldown(),
    contract.cooldownRemaining(), contract.enableAutoTrigger()
  ]);
  document.getElementById('stabilizeData').innerHTML = `
    <div class="data-item"><label>累计买入</label><span>${fromWei(buyAmt)} 代币</span></div>
    <div class="data-item"><label>累计卖出</label><span>${fromWei(sellAmt)} 代币</span></div>
    <div class="data-item"><label>买入阈值</label><span>${fromWei(buyTh)} 代币</span></div>
    <div class="data-item"><label>卖出阈值</label><span>${fromWei(sellTh)} 代币</span></div>
    <div class="data-item"><label>执行百分比</label><span>${perc} (${basisToPercent(perc)})</span></div>
    <div class="data-item"><label>每日上限</label><span>${maxD}</span></div>
    <div class="data-item"><label>今日次数</label><span>${daily}</span></div>
    <div class="data-item"><label>冷却笔数</label><span>${cd}</span></div>
    <div class="data-item"><label>剩余冷却</label><span>${cool}</span></div>
    <div class="data-item"><label>自动触发</label><span>${en?'✅ 开启':'❌ 关闭'}</span></div>
  `;
  document.getElementById('stabilizeSetters').innerHTML = `
    <input id="sBuyTh" placeholder="买入阈值(代币数)"><input id="sSellTh" placeholder="卖出阈值(代币数)">
    <input id="sPerc" placeholder="百分比(基点)"><input id="sMax" placeholder="每日上限">
    <input id="sCd" placeholder="冷却笔数"><button onclick="setStabilize()">✏️ 更新</button>
  `;
}

async function setStabilize() {
  const buy = await toWei(document.getElementById('sBuyTh').value);
  const sell = await toWei(document.getElementById('sSellTh').value);
  const perc = parseInt(document.getElementById('sPerc').value) || 0;
  const max = parseInt(document.getElementById('sMax').value) || 0;
  const cd = parseInt(document.getElementById('sCd').value) || 0;
  if (isNaN(perc) || isNaN(max) || isNaN(cd)) return alert('请输入有效整数');
  await contract.connect(signer).setAutoTriggerParams(buy, sell, perc, max, cd);
  alert('稳定参数已更新'); loadPanel('stabilize');
}

// -------------------- LP挖矿 --------------------
async function loadLP() {
  const [rate, cond, minLP, minInv, dist] = await Promise.all([
    contract.mineRate(), contract.LPRewardCondition(), contract.minLPHoldAmount(),
    contract.minInvitorHoldAmount(), contract._LPRewardDistributor()
  ]);
  document.getElementById('lpData').innerHTML = `
    <div class="data-item"><label>挖矿预留比例</label><span>${rate}%</span></div>
    <div class="data-item"><label>奖励基数</label><span>${fromWei(cond)} 代币</span></div>
    <div class="data-item"><label>最低LP持有</label><span>${fromWei(minLP)} LP</span></div>
    <div class="data-item"><label>上级最小持仓</label><span>${fromWei(minInv)} 代币</span></div>
    <div class="data-item"><label>奖励合约</label><span>${dist}</span></div>
  `;
  document.getElementById('lpSetters').innerHTML = `
    <input id="lpCond" placeholder="奖励基数(代币数)"><input id="lpMinLP" placeholder="最低LP(LP数)">
    <input id="lpMinInv" placeholder="上级最小持仓(代币数)"><button onclick="setLP()">✏️ 更新</button>
  `;
}

async function setLP() {
  const cond = await toWei(document.getElementById('lpCond').value);
  const minLP = await toWei(document.getElementById('lpMinLP').value);
  const minInv = await toWei(document.getElementById('lpMinInv').value);
  const c = contract.connect(signer);
  await c.setLPRewardCondition(cond);
  await c.setMinLPHoldAmount(minLP);
  await c.setMinInvitorHoldAmount(minInv);
  alert('LP参数已更新'); loadPanel('lp');
}

// -------------------- 邀请系统 --------------------
async function loadInvite() {
  const [gen, f, s, t, l] = await Promise.all([
    contract.generations(), contract.fristRate(), contract.secondRate(), contract.thirdRate(), contract.leftRate()
  ]);
  document.getElementById('inviteData').innerHTML = `
    <div class="data-item"><label>代数</label><span>${gen}</span></div>
    <div class="data-item"><label>第1代</label><span>${f}%</span></div>
    <div class="data-item"><label>第2代</label><span>${s}%</span></div>
    <div class="data-item"><label>第3代</label><span>${t}%</span></div>
    <div class="data-item"><label>超出后代</label><span>${l}%</span></div>
  `;
  document.getElementById('inviteSetters').innerHTML = `
    <input id="iGen" placeholder="代数"><input id="iF" placeholder="1代%"><input id="iS" placeholder="2代%">
    <input id="iT" placeholder="3代%"><input id="iL" placeholder="超出%"><button onclick="setInvite()">✏️ 更新</button>
  `;
}

async function setInvite() {
  const vals = ['iGen','iF','iS','iT','iL'].map(id => document.getElementById(id).value).map(Number);
  if (vals.some(isNaN)) return alert('请输入数字');
  await contract.connect(signer).changeInviteRate(vals);
  alert('邀请参数已更新'); loadPanel('invite');
}

// -------------------- 高级控制 --------------------
async function loadAdvanced() {
  const [bRate, bFreq, lastB, anti, off, kill, _kb, start, adEn, adNum, minTx, limitAdd, chTax, numSell] = await Promise.all([
    contract.lpBurnRate(), contract.lpBurnFrequency(), contract.lastLpBurnTime(),
    contract.antiSYNC(), contract.enableOffTrade(), contract.enableKillBlock(), contract.kb(),
    contract.startTradeBlock(), contract.airdropEnable(), contract.airdropNumbs(),
    contract._minTransAmount(), contract.limitAddLiquidity(), contract.enableChangeTax(),
    contract.numTokensSellRate()
  ]);
  document.getElementById('advancedData').innerHTML = `
    <div class="data-item"><label>底池燃烧比例</label><span>${bRate} (${basisToPercent(bRate)})</span></div>
    <div class="data-item"><label>燃烧间隔(秒)</label><span>${bFreq} (${(bFreq/3600).toFixed(1)}h)</span></div>
    <div class="data-item"><label>上次燃烧</label><span>${new Date(lastB*1000).toLocaleString()}</span></div>
    <div class="data-item"><label>反MEV</label><span>${anti?'✅ 开启':'❌ 关闭'}</span></div>
    <div class="data-item"><label>开盘控制</label><span>${off?'✅ 需要launch':'❌ 无'}</span></div>
    <div class="data-item"><label>杀区块</label><span>${kill?'✅ 开启':'❌ 关闭'} | 数量:${_kb}</span></div>
    <div class="data-item"><label>开盘区块</label><span>${start>0?start:'未启动'}</span></div>
    <div class="data-item"><label>空投</label><span>${adEn?'✅ 开启':'❌ 关闭'} | 每次${adNum}地址</span></div>
    <div class="data-item"><label>最小转账</label><span>${fromWei(minTx)} 代币</span></div>
    <div class="data-item"><label>禁止加流动性</label><span>${limitAdd?'✅ 是':'❌ 否'}</span></div>
    <div class="data-item"><label>税率可改</label><span>${chTax?'✅':'❌'}</span></div>
    <div class="data-item"><label>兑换阈值%</label><span>${numSell}%</span></div>
  `;
  document.getElementById('advancedSetters').innerHTML = `
    <input id="advBurnRate" placeholder="燃烧比例(基点)"><input id="advBurnFreq" placeholder="燃烧间隔(小时)">
    <input id="advKb" placeholder="杀区块数"><input id="advAdNum" placeholder="空投地址数(≤5)">
    <input id="advNumSell" placeholder="兑换阈值%"><button onclick="setAdvanced()">✏️ 更新</button>
    <br><button onclick="toggleAirDrop(true)">✅ 开启空投</button><button onclick="toggleAirDrop(false)">❌ 关闭空投</button>
    <button onclick="toggleAntiSync(true)">✅ 反MEV开</button><button onclick="toggleAntiSync(false)">❌ 反MEV关</button>
    <button onclick="toggleLimitAdd(true)">🚫 禁止加流动</button><button onclick="toggleLimitAdd(false)">✅ 允许加流动</button>
    <button onclick="disableTaxChange()" class="danger">🔒 永久禁改税率</button>
  `;
}

async function setAdvanced() {
  const c = contract.connect(signer);
  const br = document.getElementById('advBurnRate').value;
  const bf = document.getElementById('advBurnFreq').value;
  const kb = document.getElementById('advKb').value;
  const ad = document.getElementById('advAdNum').value;
  const ns = document.getElementById('advNumSell').value;
  if (br) await c.setlpBurnRate(parseInt(br));
  if (bf) await c.setlpBurnFrequency(parseInt(bf));
  if (kb) await c.setkb(parseInt(kb));
  if (ad) await c.setAirdropNumbs(parseInt(ad));
  if (ns) await c.setNumTokensSellRate(parseInt(ns));
  alert('高级参数已更新'); loadPanel('advanced');
}

async function toggleAirDrop(v) { await contract.connect(signer).setAirDropEnable(v); loadPanel('advanced'); }
async function toggleAntiSync(v) { await contract.connect(signer).setAntiSYNCEnable(v); loadPanel('advanced'); }
async function toggleLimitAdd(v) { await contract.connect(signer).setLimitAddLiquidity(v); loadPanel('advanced'); }
async function disableTaxChange() { await contract.connect(signer).disableChangeTax(); alert('税率修改已永久锁定'); loadPanel('advanced'); }

// -------------------- 管理员 --------------------
async function loadAdmin() {
  const [paused, pEn, mEn, wEn, maxW, fund, autoTrig, own] = await Promise.all([
    contract.pause(), contract.enablePause(), contract.enableMint(), contract.enableWalletLimit(),
    contract.maxWalletAmount(), contract.fundAddress(), contract.enableAutoTrigger(), contract.owner()
  ]);
  document.getElementById('adminData').innerHTML = `
    <div class="data-item"><label>暂停状态</label><span>${paused?'⏸️ 暂停':'▶️ 运行'}</span></div>
    <div class="data-item"><label>可暂停</label><span>${pEn?'✅':'❌'}</span></div>
    <div class="data-item"><label>可增发</label><span>${mEn?'✅':'❌'}</span></div>
    <div class="data-item"><label>钱包限制</label><span>${wEn?'✅':'❌'}</span></div>
    <div class="data-item"><label>最大持仓</label><span>${fromWei(maxW)} 代币</span></div>
    <div class="data-item"><label>基金地址</label><span>${fund}</span></div>
    <div class="data-item"><label>自动稳定</label><span>${autoTrig?'✅ 开启':'❌ 关闭'}</span></div>
    <div class="data-item"><label>当前Owner</label><span>${own}</span></div>
  `;
  document.getElementById('adminActions').innerHTML = `
    <button onclick="launch()">🚀 启动交易</button>
    <button onclick="pauseTx()" class="danger">⏸️ 暂停</button>
    <button onclick="resumeTx()" class="success">▶️ 恢复</button>
    <button onclick="disableWL()">🚫 取消限额</button>
    <button onclick="toggleAuto()">⚙️ 切换稳定</button>
    <button onclick="forceReset()">🔄 重置累计</button>
    <hr style="width:100%; border-color:var(--border);">
    <input id="wlAddr" placeholder="地址">
    <button onclick="addWhite(true)">➕ 加白名单</button>
    <button onclick="addWhite(false)">➖ 移除白名单</button>
    <button onclick="addBlack(true)">🚫 加黑名单</button>
    <button onclick="addBlack(false)">✅ 移除黑名单</button>
    <hr style="width:100%; border-color:var(--border);">
    <input id="newLimit" placeholder="新限额(代币数)"><button onclick="setLimit()">💼 设限额</button>
    <input id="mintAmt" placeholder="增发数量"><input id="mintAddr" placeholder="接收地址"><button onclick="mint()">🏦 增发</button>
  `;
}

async function launch() { await contract.connect(signer).launch(); alert('交易已启动'); loadPanel('admin'); }
async function pauseTx() { await contract.connect(signer).PauseTransaction(); alert('已暂停'); loadPanel('admin'); }
async function resumeTx() { await contract.connect(signer).recoverTransaction(); alert('已恢复'); loadPanel('admin'); }
async function disableWL() { await contract.connect(signer).disableWalletLimit(); alert('限额已取消'); loadPanel('admin'); }
async function toggleAuto() { const cur = await contract.enableAutoTrigger(); await contract.connect(signer).setEnableAutoTrigger(!cur); alert('自动稳定已切换'); loadPanel('admin'); }
async function forceReset() { await contract.connect(signer).forceResetTriggers(); alert('买卖累计已清零'); loadPanel('stabilize'); }
async function addWhite(enable) {
  const addr = document.getElementById('wlAddr').value;
  if (!ethers.utils.isAddress(addr)) return alert('地址无效');
  await contract.connect(signer).setWhiteList([addr], enable);
  alert(enable ? '已加入白名单' : '已移除白名单');
}
async function addBlack(enable) {
  const addr = document.getElementById('wlAddr').value;
  if (!ethers.utils.isAddress(addr)) return alert('地址无效');
  await contract.connect(signer).multi_bclist([addr], enable);
  alert(enable ? '已加入黑名单' : '已移除黑名单');
}
async function setLimit() {
  const val = await toWei(document.getElementById('newLimit').value);
  await contract.connect(signer).changeWalletLimit(val);
  alert('限额已设置'); loadPanel('admin');
}
async function mint() {
  const addr = document.getElementById('mintAddr').value;
  const amt = await toWei(document.getElementById('mintAmt').value);
  await contract.connect(signer).mintTokens(addr, amt);
  alert('增发成功'); loadPanel('token');
}

// 自动加载保存的地址
(async () => {
  const saved = localStorage.getItem('crc_addr_v4');
  if (saved) { document.getElementById('contractAddress').value = saved; loadContract(); }
})();
</script>
