<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRC 稳定控制面板 v5.5 · 全功能 · 多节点高可用</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0e17; --card: #111827; --border: #1f2a3a;
            --text: #e2e8f0; --text2: #94a3b8; --accent: #3b82f6;
            --accent2: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --purple: #8b5cf6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            padding: 20px; min-height: 100vh;
        }
        .container { max-width: 1700px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .version {
            background: var(--accent); color: #fff;
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 700;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 22px 24px; margin-bottom: 18px;
        }
        .card h2 {
            font-size: 1.25rem; margin-bottom: 16px;
            display: flex; align-items: center; gap: 10px; color: var(--accent);
        }
        .card h3 {
            font-size: 1rem; margin: 12px 0 10px;
            color: var(--text2); font-weight: 500;
        }
        .input-group {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-bottom: 12px; align-items: center;
        }
        input, select, button {
            padding: 10px 15px; border-radius: 10px;
            border: 1px solid var(--border); background: #1e293b;
            color: var(--text); font-size: 0.9rem; font-family: inherit;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        input { min-width: 140px; }
        button {
            cursor: pointer; background: var(--accent);
            border: none; font-weight: 600; white-space: nowrap;
            transition: all 0.2s;
        }
        button:hover { filter: brightness(1.18); transform: translateY(-1px); }
        button:active { transform: scale(0.97); }
        button.danger { background: var(--danger); }
        button.success { background: var(--accent2); }
        button.wallet-btn { background: var(--accent2); }
        button.refresh-btn { background: #475569; }
        button.purple-btn { background: var(--purple); }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
        .data-item {
            background: #0f172a; padding: 11px 15px;
            border-radius: 11px; border: 1px solid #1e293b;
        }
        .data-item label { font-size: 0.73rem; color: var(--text2); margin-bottom: 4px; display: block; }
        .data-item span { font-size: 1.05rem; font-weight: 600; word-break: break-all; color: #f1f5f9; }
        .tooltip {
            position: relative; cursor: help;
            border-bottom: 1px dashed var(--text2); font-size: 0.8rem;
        }
        .tooltip::after {
            content: attr(data-tip); position: absolute; left: 0; top: 115%;
            background: #1e293b; color: #fff; padding: 8px 13px; border-radius: 8px;
            font-size: 0.78rem; width: max-content; max-width: 320px; z-index: 100;
            opacity: 0; visibility: hidden; transition: 0.2s; border: 1px solid var(--border);
            pointer-events: none; white-space: normal; line-height: 1.4;
        }
        .tooltip:hover::after { opacity: 1; visibility: visible; }
        .tabs { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
        .tab {
            background: #1e293b; border: 1px solid var(--border);
            color: var(--text2); padding: 9px 18px; border-radius: 10px;
            cursor: pointer; font-weight: 500; font-size: 0.9rem;
        }
        .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .hidden { display: none !important; }
        .status-text { font-size: 0.82rem; margin-left: 10px; font-weight: 500; }
        hr { border-color: var(--border); margin: 16px 0; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 14px; font-size: 0.75rem; font-weight: 600; }
        .badge-on { background: #065f46; color: #6ee7b7; }
        .badge-off { background: #7f1d1d; color: #fca5a5; }
        .event-log { background: #0f172a; border-radius: 10px; padding: 12px 15px; margin-top: 10px; font-size: 0.85rem; line-height: 1.6; }
        .event-log strong { color: var(--accent2); }
        .rpc-indicator { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; }
        .rpc-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent2); }
        .rpc-dot.warn { background: var(--warning); }
        .rpc-dot.error { background: var(--danger); }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .data-grid { grid-template-columns: 1fr; }
            input { min-width: 100%; }
            .input-group { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div style="display: flex; align-items: center; gap: 14px;">
            <h1>🛡️ CRC 稳定控制面板</h1>
            <span class="version">v5.5</span>
            <span class="rpc-indicator">
                <span class="rpc-dot" id="rpcDot"></span> <span id="rpcLabel">节点正常</span>
            </span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="connectWallet" class="wallet-btn">🔌 连接钱包</button>
            <span id="walletAddress" style="font-size:0.88rem; color: var(--text2);"></span>
        </div>
    </div>

    <div class="card">
        <div class="input-group">
            <input type="text" id="contractAddress" placeholder="输入 PandaTokenV4 合约地址" style="flex:1; min-width:280px;">
            <button id="loadContract" class="success">📦 加载合约</button>
            <button id="saveAddress" class="refresh-btn">💾 保存</button>
        </div>
        <div id="contractStatus" style="margin-top:8px; color:var(--warning); font-size:0.9rem;"></div>
    </div>

    <div class="tabs" id="tabGroup">
        <div class="tab active" data-tab="token">📊 代币</div>
        <div class="tab" data-tab="tax">🧾 税率</div>
        <div class="tab" data-tab="stabilize">⚖️ 稳定</div>
        <div class="tab" data-tab="lp">💧 挖矿</div>
        <div class="tab" data-tab="invite">👥 邀请</div>
        <div class="tab" data-tab="advanced">⚙️ 高级</div>
        <div class="tab" data-tab="admin">🛡️ 管理</div>
    </div>

    <div id="panel-token" class="card"><h2>📊 代币数据 <span id="status-token" class="status-text"></span></h2><div class="data-grid" id="tokenData"></div></div>
    <div id="panel-tax" class="card hidden"><h2>🧾 税率配置 <span id="status-tax" class="status-text"></span></h2><div class="data-grid" id="taxData"></div><hr><h3>✏️ 修改交易税率（completeCustoms）</h3><div class="input-group" id="taxSetters"></div><hr><h3>✏️ 修改流动性税率</h3><div class="input-group" id="liqTaxSetters"></div></div>
    <div id="panel-stabilize" class="card hidden"><h2>⚖️ 稳定机制 <span id="status-stabilize" class="status-text"></span></h2><div class="data-grid" id="stabilizeData"></div><hr><h3>🔍 稳定操作地址</h3><div class="data-grid" id="stabilizeAddresses"></div><hr><h3>💰 实时余额验证 <button id="verifyBalances" class="refresh-btn">🔄 查询余额</button></h3><div id="balanceVerification"></div><hr><h3>📋 最近执行记录 <button id="fetchStableEvents" class="refresh-btn">🔄 查询事件</button></h3><div id="stableEventsResult"></div><hr><h3>✏️ 设置稳定参数</h3><div class="input-group" id="stabilizeSetters"></div></div>
    <div id="panel-lp" class="card hidden"><h2>💧 LP 挖矿 <span id="status-lp" class="status-text"></span></h2><div class="data-grid" id="lpData"></div><hr><h3>✏️ 设置挖矿参数</h3><div class="input-group" id="lpSetters"></div><hr><h3>✏️ 排除/恢复 LP 提供者</h3><div class="input-group" id="lpExcludeSetters"></div></div>
    <div id="panel-invite" class="card hidden"><h2>👥 邀请系统 <span id="status-invite" class="status-text"></span></h2><div class="data-grid" id="inviteData"></div><hr><h3>✏️ 设置邀请参数</h3><div class="input-group" id="inviteSetters"></div><hr><h3>🔍 查询邀请关系</h3><div class="input-group" id="inviteQuery"></div><div id="inviteQueryResult" style="margin-top:8px;font-size:0.9rem;color:var(--accent2);"></div></div>
    <div id="panel-advanced" class="card hidden"><h2>⚙️ 高级控制 <span id="status-advanced" class="status-text"></span></h2><div class="data-grid" id="advancedData"></div><hr><h3>✏️ 设置参数</h3><div class="input-group" id="advancedSetters"></div><hr><h3>🔘 开关控制</h3><div class="input-group" id="advancedToggles"></div></div>
    <div id="panel-admin" class="card hidden"><h2>🛡️ 管理员操作 <span id="status-admin" class="status-text"></span></h2><div class="data-grid" id="adminData"></div><hr><h3>🔧 核心操作</h3><div class="input-group" id="adminActions"></div><hr><h3>📋 名单管理</h3><div class="input-group" id="adminLists"></div><hr><h3>💼 其他设置</h3><div class="input-group" id="adminExtra"></div></div>
</div>

<script>
(async function() {
    // ==================== 多节点 RPC ====================
    const RPC_LIST = [
        "https://1rpc.io/bnb",
        "https://bsc-dataseed1.ninicoin.io",
        "https://bsc-dataseed2.bnbchain.org",
        "https://bsc.blockpi.network/v1/rpc/public",
        "https://bsc-dataseed.binance.org/"
    ];
    let rpcIndex = 0;
    let provider = new ethers.providers.JsonRpcProvider(RPC_LIST[0]);
    let signer = null;
    let contract = null;
    let currentAddr = "";
    let currentPanel = "token";
    let tokenDecimals = 18;
    let currencyAddress = "";
    let currencyIsEth = false;

    function updateRpcStatus(color, text) {
        document.getElementById('rpcDot').className = 'rpc-dot' + (color ? ' ' + color : '');
        document.getElementById('rpcLabel').textContent = text || '节点正常';
    }

    async function switchRPC() {
        rpcIndex = (rpcIndex + 1) % RPC_LIST.length;
        const newRpc = RPC_LIST[rpcIndex];
        console.warn('RPC 故障，切换至节点 ' + (rpcIndex+1) + ': ' + newRpc);
        provider = new ethers.providers.JsonRpcProvider(newRpc);
        if (currentAddr) contract = new ethers.Contract(currentAddr, abi, signer || provider);
        updateRpcStatus('warn', '节点'+(rpcIndex+1)+' (切换中)');
        await new Promise(r => setTimeout(r, 500));
    }

    async function withRetry(fn, maxRetries = 4) {
        for (let i = 0; i < maxRetries; i++) {
            try {
                const res = await fn();
                updateRpcStatus('', '节点'+(rpcIndex+1)+'正常');
                return res;
            } catch (e) {
                if (i < maxRetries - 1 && (e.message.includes('network') || e.message.includes('timeout') || e.message.includes('429'))) {
                    await switchRPC();
                } else throw e;
            }
        }
    }

    // 完整 ABI
    const abi = [
        "function name() view returns (string)",
        "function symbol() view returns (string)",
        "function decimals() view returns (uint256)",
        "function totalSupply() view returns (uint256)",
        "function balanceOf(address) view returns (uint256)",
        "function allowance(address,address) view returns (uint256)",
        "function getCirculatingSupply() view returns (uint256)",
        "function owner() view returns (address)",
        "function _mainPair() view returns (address)",
        "function fundAddress() view returns (address)",
        "function deadAddress() view returns (address)",
        "function _allWhiteList(address) view returns (bool)",
        "function _rewardList(address) view returns (bool)",
        "function isReward(address) view returns (uint256)",
        "function enableRewardList() view returns (bool)",
        "function enableMint() view returns (bool)",
        "function enablePause() view returns (bool)",
        "function enableWalletLimit() view returns (bool)",
        "function pause() view returns (bool)",
        "function enableChangeTax() view returns (bool)",
        "function enableOffTrade() view returns (bool)",
        "function enableKillBlock() view returns (bool)",
        "function enableAutoTrigger() view returns (bool)",
        "function antiSYNC() view returns (bool)",
        "function airdropEnable() view returns (bool)",
        "function limitAddLiquidity() view returns (bool)",
        "function _buyFundFee() view returns (uint256)",
        "function _buyLPFee() view returns (uint256)",
        "function buy_burnFee() view returns (uint256)",
        "function _sellFundFee() view returns (uint256)",
        "function _sellLPFee() view returns (uint256)",
        "function sell_burnFee() view returns (uint256)",
        "function addLiquidityFee() view returns (uint256)",
        "function removeLiquidityFee() view returns (uint256)",
        "function numTokensSellRate() view returns (uint256)",
        "function kb() view returns (uint256)",
        "function startTradeBlock() view returns (uint256)",
        "function airdropNumbs() view returns (uint256)",
        "function _minTransAmount() view returns (uint256)",
        "function maxWalletAmount() view returns (uint256)",
        "function lpBurnRate() view returns (uint256)",
        "function lpBurnFrequency() view returns (uint256)",
        "function lastLpBurnTime() view returns (uint256)",
        "function mineRate() view returns (uint256)",
        "function LPRewardCondition() view returns (uint256)",
        "function minLPHoldAmount() view returns (uint256)",
        "function minInvitorHoldAmount() view returns (uint256)",
        "function _LPRewardDistributor() view returns (address)",
        "function generations() view returns (uint256)",
        "function fristRate() view returns (uint256)",
        "function secondRate() view returns (uint256)",
        "function thirdRate() view returns (uint256)",
        "function leftRate() view returns (uint256)",
        "function _inviter(address) view returns (address)",
        "function getBinderLength(address) view returns (uint256)",
        "function totalBuyAmount() view returns (uint256)",
        "function totalSellAmount() view returns (uint256)",
        "function buyTriggerThreshold() view returns (uint256)",
        "function sellTriggerThreshold() view returns (uint256)",
        "function triggerActionPercent() view returns (uint256)",
        "function maxDailyTriggers() view returns (uint8)",
        "function dailyTriggerCount() view returns (uint8)",
        "function triggerCooldown() view returns (uint256)",
        "function cooldownRemaining() view returns (uint256)",
        "function pendingSellExecute() view returns (bool)",
        "function pendingBuyExecute() view returns (bool)",
        "function currency() view returns (address)",
        "function currencyIsEth() view returns (bool)",
        "function completeCustoms(uint256[]) external",
        "function setAutoTriggerParams(uint256,uint256,uint256,uint8,uint256) external",
        "function setLPRewardCondition(uint256) external",
        "function setMinLPHoldAmount(uint256) external",
        "function setMinInvitorHoldAmount(uint256) external",
        "function changeInviteRate(uint256[]) external",
        "function launch() external",
        "function PauseTransaction() external",
        "function recoverTransaction() external",
        "function disableWalletLimit() external",
        "function changeWalletLimit(uint256) external",
        "function setEnableAutoTrigger(bool) external",
        "function setLimitAddLiquidity(bool) external",
        "function setlpBurnRate(uint256) external",
        "function setlpBurnFrequency(uint256) external",
        "function setAirDropEnable(bool) external",
        "function setAirdropNumbs(uint256) external",
        "function setkb(uint256) external",
        "function setAntiSYNCEnable(bool) external",
        "function setNumTokensSellRate(uint256) external",
        "function disableChangeTax() external",
        "function setWhiteList(address[],bool) external",
        "function multi_bclist(address[],bool) external",
        "function mintTokens(address,uint256) external",
        "function forceResetTriggers() external",
        "function setSwapPairList(address,bool) external",
        "function setMinTransAmount(uint256) external",
        "function setFundAddress(address) external",
        "function setAddLiquidityFee(uint256) external",
        "function setRemoveLiquidityFee(uint256) external",
        "function setExcludeLPProvider(address,bool) external",
        "function setClaims(address,uint256) external",
        "event StabilizeSellExecuted(uint256 indexed tokensSold, uint256 indexed usdtReceived)",
        "event StabilizeBuyExecuted(uint256 indexed usdtSpent, uint256 indexed tokensBought)"
    ];

    function toWei(val, dec = tokenDecimals) {
        try { return ethers.utils.parseUnits(String(val), dec); } catch (e) { return ethers.BigNumber.from(0); }
    }
    function fromWei(val, dec = tokenDecimals) {
        try { return ethers.utils.formatUnits(val, dec); } catch (e) { return String(val); }
    }
    function basisToPercent(b) { return (Number(b)/100).toFixed(2)+'%'; }
    function bnToNum(bn) { try { return Number(ethers.utils.formatUnits(bn,0)); } catch { return Number(bn); } }

    function setStatus(panel, msg, isErr) {
        const el = document.getElementById('status-'+panel);
        if (!el) return;
        el.textContent = msg;
        el.style.color = isErr ? 'var(--danger)' : 'var(--accent2)';
    }

    // 标签切换
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', ()=>{
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            tab.classList.add('active');
            currentPanel = tab.dataset.tab;
            document.querySelectorAll('[id^="panel-"]').forEach(p=>p.classList.add('hidden'));
            document.getElementById('panel-'+currentPanel).classList.remove('hidden');
            loadPanel(currentPanel);
        });
    });

    document.getElementById('connectWallet').onclick = async ()=>{
        if(!window.ethereum) return alert('请安装MetaMask');
        await window.ethereum.request({method:'eth_requestAccounts'});
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        const addr = await signer.getAddress();
        document.getElementById('walletAddress').textContent = '✅ '+addr.slice(0,6)+'...'+addr.slice(-4);
        if(currentAddr) { contract = new ethers.Contract(currentAddr, abi, signer||provider); loadPanel(currentPanel); }
    };

    document.getElementById('loadContract').onclick = loadContract;
    document.getElementById('saveAddress').onclick = ()=> localStorage.setItem('crc_addr_v5', document.getElementById('contractAddress').value.trim());

    async function loadContract() {
        const addr = document.getElementById('contractAddress').value.trim();
        if(!ethers.utils.isAddress(addr)) return alert('地址无效');
        currentAddr = addr;
        localStorage.setItem('crc_addr_v5', addr);
        try {
            contract = new ethers.Contract(addr, abi, signer||provider);
            const dec = await withRetry(()=>contract.decimals());
            tokenDecimals = bnToNum(dec);
            currencyAddress = await withRetry(()=>contract.currency());
            currencyIsEth = await withRetry(()=>contract.currencyIsEth());
            document.getElementById('contractStatus').textContent = '✅ 合约已加载 | 精度: '+tokenDecimals;
            loadPanel(currentPanel);
        } catch(e) { alert('加载失败: '+e.message); }
    }

    async function loadPanel(panel) {
        if(!contract) return;
        setStatus(panel, '⏳ 加载中...');
        try {
            switch(panel) {
                case 'token': await loadToken(); break;
                case 'tax': await loadTax(); break;
                case 'stabilize': await loadStabilize(); break;
                case 'lp': await loadLP(); break;
                case 'invite': await loadInvite(); break;
                case 'advanced': await loadAdvanced(); break;
                case 'admin': await loadAdmin(); break;
            }
            setStatus(panel, '✅ 已更新');
        } catch(e) { setStatus(panel, '❌ '+e.message, true); }
    }

    // ================== 面板加载 ==================
    async function loadToken() {
        const [name,sym,total,circ,pair,own,pairBal,dead] = await Promise.all([
            contract.name(), contract.symbol(), contract.totalSupply(),
            contract.getCirculatingSupply(), contract._mainPair(), contract.owner(),
            contract.balanceOf(contract._mainPair()), contract.deadAddress().catch(()=>'0xdead')
        ]);
        document.getElementById('tokenData').innerHTML = `
            <div class="data-item"><label>名称</label><span>${name}</span></div>
            <div class="data-item"><label>符号</label><span>${sym}</span></div>
            <div class="data-item"><label>精度</label><span>${tokenDecimals}</span></div>
            <div class="data-item"><label>总供应</label><span>${fromWei(total)}</span></div>
            <div class="data-item"><label>流通量</label><span>${fromWei(circ)}</span></div>
            <div class="data-item"><label>交易对</label><span>${pair}</span></div>
            <div class="data-item"><label>池子余额</label><span>${fromWei(pairBal)}</span></div>
            <div class="data-item"><label>Owner</label><span>${own}</span></div>
            <div class="data-item"><label>黑洞地址</label><span>${dead}</span></div>`;
    }

    async function loadTax() {
        const [bf,blp,bb,sf,slp,sb,add,rem,chTax,numSell] = await Promise.all([
            contract._buyFundFee(), contract._buyLPFee(), contract.buy_burnFee(),
            contract._sellFundFee(), contract._sellLPFee(), contract.sell_burnFee(),
            contract.addLiquidityFee(), contract.removeLiquidityFee(), contract.enableChangeTax(),
            contract.numTokensSellRate()
        ]);
        document.getElementById('taxData').innerHTML = `
            <div class="data-item"><label>买入基金</label><span>${bnToNum(bf)} (${basisToPercent(bf)})</span></div>
            <div class="data-item"><label>买入LP</label><span>${bnToNum(blp)}</span></div>
            <div class="data-item"><label>买入销毁</label><span>${bnToNum(bb)}</span></div>
            <div class="data-item"><label>卖出基金</label><span>${bnToNum(sf)}</span></div>
            <div class="data-item"><label>卖出LP</label><span>${bnToNum(slp)}</span></div>
            <div class="data-item"><label>卖出销毁</label><span>${bnToNum(sb)}</span></div>
            <div class="data-item"><label>添加流动性税</label><span>${bnToNum(add)}</span></div>
            <div class="data-item"><label>移除流动性税</label><span>${bnToNum(rem)}</span></div>
            <div class="data-item"><label>兑换阈值%</label><span>${bnToNum(numSell)}%</span></div>
            <div class="data-item"><label>税率可修改</label><span>${chTax?'✅':'❌'}</span></div>`;
        document.getElementById('taxSetters').innerHTML = `
            <input id="tx1" placeholder="买入基金(基点)"><input id="tx2" placeholder="买入LP(基点)"><input id="tx3" placeholder="买入销毁(基点)">

    async function verifyBalances() {
        const div = document.getElementById('balanceVerification');
        div.innerHTML = '⏳ 查询中...';
        try {
            const [block, contractAddr, dist] = await withRetry(async ()=>{
                const b = await provider.getBlockNumber();
                return [b, contract.address, await contract._LPRewardDistributor()];
            });
            let currBal;
            if(currencyIsEth) {
                currBal = await withRetry(()=>provider.getBalance(contractAddr));
            } else {
                const curr = new ethers.Contract(currencyAddress, ['function balanceOf(address) view returns (uint256)'], provider);
                currBal = await withRetry(()=>curr.balanceOf(contractAddr));
            }
            const tokenBal = await withRetry(()=>contract.balanceOf(dist));
            const time = new Date().toLocaleString();
            div.innerHTML = `<div class="event-log">
                <strong>💰 余额快照</strong><br>
                🕒 ${time} | 区块: ${block}<br>
                📍 合约: ${contractAddr}<br>
                💵 稳定币/ETH: ${fromWei(currBal,18)} ${currencyIsEth?'BNB':'USDT'}<br>
                🎁 分发器代币: ${fromWei(tokenBal)} 代币</div>`;
        } catch(e) { div.innerHTML = '❌ 查询失败: '+e.message; }
    }

    async function fetchStableEvents() {
        const div = document.getElementById('stableEventsResult');
        div.innerHTML = '⏳ 查询事件中...';
        try {
            const [sellTopic,buyTopic] = [ethers.utils.id('StabilizeSellExecuted(uint256,uint256)'), ethers.utils.id('StabilizeBuyExecuted(uint256,uint256)')];
            const currentBlock = await withRetry(()=>provider.getBlockNumber());
            const fromBlock = currentBlock - 50000;
            const [sellLogs, buyLogs] = await withRetry(async ()=>{
                return [await provider.getLogs({address:contract.address, topics:[sellTopic], fromBlock, toBlock:currentBlock}),
                        await provider.getLogs({address:contract.address, topics:[buyTopic], fromBlock, toBlock:currentBlock})];
            });
            let html = '';
            if(sellLogs.length) {
                const l = sellLogs[sellLogs.length-1];
                const p = contract.interface.parseLog(l);
                const block = await withRetry(()=>provider.getBlock(l.blockNumber));
                html += `<div class="event-log"><strong>📤 最近卖出</strong><br>交易: <a href="https://bscscan.com/tx/${l.transactionHash}" target="_blank">${l.transactionHash.slice(0,20)}...</a><br>卖出代币: ${fromWei(p.args.tokensSold)}<br>获得USDT: ${fromWei(p.args.usdtReceived,18)}<br>🕒 ${new Date(block.timestamp*1000).toLocaleString()}</div>`;
            } else html += '<div class="event-log">📤 无卖出记录</div>';
            if(buyLogs.length) {
                const l = buyLogs[buyLogs.length-1];
                const p = contract.interface.parseLog(l);
                const block = await withRetry(()=>provider.getBlock(l.blockNumber));
                html += `<div class="event-log"><strong>📥 最近回购</strong><br>交易: <a href="https://bscscan.com/tx/${l.transactionHash}" target="_blank">${l.transactionHash.slice(0,20)}...</a><br>花费USDT: ${fromWei(p.args.usdtSpent,18)}<br>回购代币: ${fromWei(p.args.tokensBought)}<br>🕒 ${new Date(block.timestamp*1000).toLocaleString()}</div>`;
            } else html += '<div class="event-log">📥 无回购记录</div>';
            div.innerHTML = html;
        } catch(e) { div.innerHTML = '❌ 查询失败: '+e.message; }
    }
